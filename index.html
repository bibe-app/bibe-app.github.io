<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIBE</title>
<meta name="description" content="Trouvez le lait de votre bebe dans une pharmacie proche.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B7A52" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1310" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIBE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="bibe-version" content="0.1.0">
</head>
<body>

<style>
  :root {
    --paper: #F2F5F1; --card: #FFFFFF; --sunk: #E9EEE8;
    --ink: #14201B; --soft: #52625A; --faint: #849289;
    --rule: #DCE4DD; --firm: #C2CEC5;
    --green: #0B7A52; --wash: #E0EFE7;
    --corail: #C4462A; --corail-wash: #F8E7E2;
    --badge: #E9EEE8; --badge-sel: #C8E3D5;
    --amber: #9A5B08; --hors: #0C1310;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0C1310; --card: #141D18; --sunk: #101915;
      --ink: #E3ECE6; --soft: #9FB1A7; --faint: #74857B;
      --rule: #24302A; --firm: #35443C;
      --green: #34C48A; --wash: #14301F;
      --corail: #F08A6E; --corail-wash: #351B15;
      --badge: #1E2A24; --badge-sel: #1F4231;
      --amber: #DFA255; --hors: #050907;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0C1310; --card: #141D18; --sunk: #101915;
    --ink: #E3ECE6; --soft: #9FB1A7; --faint: #74857B;
    --rule: #24302A; --firm: #35443C;
    --green: #34C48A; --wash: #14301F;
    --corail: #F08A6E; --corail-wash: #351B15;
    --badge: #1E2A24; --badge-sel: #1F4231;
    --amber: #DFA255; --hors: #050907;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--hors); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 16px 36px; gap: 18px; min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .tel {
    width: 100%; max-width: 412px; background: var(--paper); border-radius: 26px;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    height: 790px; max-height: calc(100vh - 110px); min-height: 560px;
  }
  .ecran { flex: 1; overflow-y: auto; padding: 0 18px 100px; }
  .ecran::-webkit-scrollbar { width: 0; }

  /* Sur un vrai telephone, et une fois l'application ajoutee a l'ecran
     d'accueil, le cadre n'a plus de sens : on occupe tout l'ecran.
     100dvh et non 100vh, sinon la barre d'adresse mobile rogne le bas. */
  @media (max-width: 480px), (display-mode: standalone) {
    body { padding: 0; gap: 0; min-height: 100dvh; background: var(--paper); }
    .tel {
      max-width: none; width: 100%; height: 100dvh; max-height: none;
      min-height: 0; border-radius: 0; box-shadow: none;
    }
    .ecran { padding-left: 16px; padding-right: 16px; }
    .legende { display: none; }
    /* Encoche et barre de geste : on respecte les zones sures d'iPhone. */
    .haut { padding-top: calc(17px + env(safe-area-inset-top)); }
    .bas { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }

  /* ---------- Ouverture ---------- */

  .splash {
    position: absolute; inset: 0; background: var(--paper); z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; cursor: pointer;
  }
  .splash-logo {
    font-size: 46px; font-weight: 800; letter-spacing: 4px; color: var(--green);
    animation: apparait 0.7s ease both;
  }
  .splash-bl { font-size: 14.5px; color: var(--soft); animation: apparait 0.7s 0.25s ease both; }
  .splash-note { position: absolute; bottom: 26px; font-size: 12px; color: var(--faint); }
  @keyframes apparait { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .splash-logo, .splash-bl { animation: none; } }

  /* ---------- Barre haute ---------- */

  .haut { position: sticky; top: 0; z-index: 5; background: var(--paper);
    padding: 17px 0 11px; display: flex; align-items: center; gap: 10px; }
  .logo { font-size: 19px; font-weight: 800; letter-spacing: 1.4px; color: var(--green); }
  .role-tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--faint); border: 1px solid var(--rule); padding: 4px 8px; border-radius: 5px;
    background: none;
  }
  .role-tag:hover { color: var(--ink); border-color: var(--faint); }
  .retour { background: none; border: none; padding: 6px 8px 6px 0; color: var(--soft);
    font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
  .retour:hover { color: var(--ink); }
  .haut-fin { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .rond { background: var(--card); border: 1px solid var(--firm); border-radius: 999px;
    width: 33px; height: 33px; display: inline-flex; align-items: center; justify-content: center; color: var(--soft); }
  .rond:hover { color: var(--ink); border-color: var(--faint); }

  h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 6px; text-wrap: balance; }
  h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .chapo { color: var(--soft); margin: 0 0 20px; font-size: 15px; }

  /* ---------- Choix du role ---------- */

  .role-carte {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 16px;
    padding: 20px; text-align: left; margin-bottom: 11px; display: flex; flex-direction: column; gap: 5px;
  }
  .role-carte:hover { border-color: var(--green); }
  .role-carte .t { font-size: 18px; font-weight: 700; }
  .role-carte .d { font-size: 14px; color: var(--soft); line-height: 1.45; }

  /* ---------- Communs ---------- */

  .carte-lait { background: var(--card); border: 1px solid var(--rule); border-radius: 16px;
    padding: 16px; display: flex; align-items: center; gap: 14px; width: 100%;
    text-align: left; margin-bottom: 10px; }
  .carte-lait:hover { border-color: var(--firm); }
  .carte-lait.fantome { border-style: dashed; background: transparent; cursor: default;
    font-style: italic; opacity: 0.62; }
  .carte-lait.fantome:hover { border-color: var(--rule); }
  .carte-lait.fantome .vignette { background: var(--sunk); color: var(--faint); }
  .legende-fantome { margin: 8px 0 0; font-size: 12.5px; color: var(--faint);
    font-style: italic; text-align: center; }
  .vignette { flex: none; width: 46px; height: 46px; border-radius: 12px; background: var(--wash);
    color: var(--green); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; }
  .carte-lait .qui { font-size: 12.5px; color: var(--faint); }
  .carte-lait .quoi { font-weight: 700; }
  .carte-lait .marque { font-size: 13px; color: var(--soft); }

  .cta { width: 100%; background: var(--corail); color: #fff; border: none; border-radius: 14px;
    padding: 17px; font-size: 17px; font-weight: 700; margin-top: 13px; }
  .cta.vert { background: var(--green); color: var(--paper); }
  .cta:hover { filter: brightness(1.06); }
  .cta-2 { width: 100%; background: none; color: var(--soft); border: 1px solid var(--firm);
    border-radius: 14px; padding: 14px; font-size: 15px; margin-top: 10px; }
  .cta-2:hover { color: var(--ink); border-color: var(--faint); }
  .aide { margin-top: 20px; padding: 14px 16px; background: var(--sunk); border-radius: 12px;
    font-size: 13.5px; color: var(--soft); line-height: 1.5; }

  /* Encart du compte, en bas de l'accueil parent */
  .encart-compte {
    margin-top: 22px; padding: 18px; background: var(--card);
    border: 1px solid var(--rule); border-radius: 14px;
  }
  .encart-titre { margin: 0 0 12px; font-size: 16.5px; font-weight: 700; }
  .encart-liste {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 9px;
  }
  .encart-liste li {
    position: relative; padding-left: 24px; font-size: 14px;
    color: var(--soft); line-height: 1.45;
  }
  .encart-liste li::before {
    content: "✓"; position: absolute; left: 0; top: 0;
    color: var(--green); font-weight: 800; font-size: 13px;
  }
  .encart-compte .cta { margin-top: 16px; }
  .encart-pied {
    margin: 12px 0 0; font-size: 12.5px; color: var(--faint);
    line-height: 1.45; text-align: center;
  }

  .champ { width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 16px; font-size: 16px; margin-bottom: 10px; }
  .champ::placeholder { color: var(--faint); }
  .code { letter-spacing: 0.45em; font-family: var(--mono); text-align: center; font-size: 21px; }

  .famille { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .marque-carte { background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 13px 12px; text-align: left; font-weight: 700; font-size: 14.5px; min-height: 62px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px; position: relative; }
  .marque-carte:hover { border-color: var(--firm); }
  .marque-carte .nb { font-size: 11.5px; font-weight: 400; color: var(--faint); font-family: var(--mono); }
  .marque-carte[data-etat="fait"] { border-color: var(--green); background: var(--wash); }
  .marque-carte[data-etat="fait"] .nb { color: var(--green); font-weight: 600; }
  .marque-carte[data-etat="absente"] { background: var(--sunk); border-style: dashed; opacity: 0.72; }
  .marque-carte[data-etat="absente"] .nb { color: var(--amber); }

  .recherche { width: 100%; background: var(--card); border: 1px solid var(--rule);
    border-radius: 12px; padding: 13px 15px; font-size: 16px; margin-bottom: 4px; }
  .recherche::placeholder { color: var(--faint); }

  .groupe { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faint); margin: 18px 0 7px; }
  .ligne { width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 15px; text-align: left; display: flex; align-items: center; gap: 11px; margin-bottom: 7px; }
  .ligne:hover { border-color: var(--firm); }
  .ligne[aria-pressed="true"] { border-color: var(--green); background: var(--wash); }
  .ligne .nom { font-weight: 600; }
  .ligne .spec { font-size: 11.5px; color: var(--soft); background: var(--badge);
    padding: 2px 8px; border-radius: 5px; margin-left: auto; white-space: nowrap; }
  .ligne[aria-pressed="true"] .spec { background: var(--badge-sel); color: var(--ink); }
  .case { flex: none; width: 22px; height: 22px; border: 2px solid var(--firm); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    font-weight: 800; color: transparent; }
  .ligne[aria-pressed="true"] .case { background: var(--green); border-color: var(--green); color: var(--paper); }

  /* ---------- Parent : resultats ---------- */

  .bandeau-lait { background: var(--wash); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .bandeau-lait .m { font-size: 11px; font-weight: 700; color: var(--green);
    text-transform: uppercase; letter-spacing: 0.05em; }
  .bandeau-lait .p { font-weight: 700; }
  .pdv { width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    padding: 15px; text-align: left; margin-bottom: 9px; display: flex; flex-direction: column; gap: 7px; }
  .pdv:hover { border-color: var(--firm); }
  .pdv-haut { display: flex; gap: 12px; align-items: flex-start; }
  .pdv-nom { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .pdv-adr { font-size: 13px; color: var(--soft); }
  .pdv-dist { margin-left: auto; font-family: var(--mono); font-weight: 700; color: var(--green);
    font-size: 15px; white-space: nowrap; }
  .etiquette { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    padding: 3px 9px; border-radius: 6px; font-weight: 600; align-self: flex-start; }
  .etiquette.ok { background: var(--wash); color: var(--green); }
  .etiquette.inconnu { background: var(--badge); color: var(--soft); }
  .avert { font-size: 12.5px; color: var(--soft); background: var(--sunk); padding: 11px 13px;
    border-radius: 10px; margin-bottom: 14px; line-height: 1.45; }

  .fiche-actions { display: flex; gap: 9px; margin: 18px 0 14px; }
  .act-1 { flex: 2; background: var(--corail); color: #fff; border: none; border-radius: 13px;
    padding: 16px; font-size: 16px; font-weight: 700; }
  .act-2 { flex: 1; background: var(--wash); color: var(--green); border: none; border-radius: 13px;
    padding: 16px; font-size: 16px; font-weight: 700; }
  .infos { display: flex; flex-direction: column; gap: 1px; background: var(--rule);
    border-radius: 12px; overflow: hidden; }
  .info { background: var(--card); padding: 13px 15px; display: flex; gap: 12px; font-size: 14.5px; }
  .info .k { color: var(--faint); min-width: 74px; font-size: 13px; }

  .question-bloc { text-align: center; padding: 28px 0 8px; }
  .reponses { display: flex; gap: 10px; margin-top: 20px; }
  .rep { flex: 1; background: var(--card); border: 1px solid var(--firm); border-radius: 14px;
    padding: 18px 10px; font-size: 16px; font-weight: 700; }
  .rep.oui:hover { border-color: var(--green); color: var(--green); }
  .rep.non:hover { border-color: var(--corail); color: var(--corail); }

  .vide { text-align: center; padding: 24px 0 8px; }
  .vide-rond { width: 58px; height: 58px; border-radius: 50%; background: var(--sunk);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    font-size: 24px; color: var(--faint); }
  .equiv { background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 15px; margin-bottom: 8px; text-align: left; width: 100%; }
  .equiv:hover { border-color: var(--firm); }
  .equiv .em { font-size: 11px; font-weight: 700; color: var(--green);
    text-transform: uppercase; letter-spacing: 0.05em; }
  .equiv .ep { font-weight: 600; }
  .source { margin-top: 16px; padding: 13px 15px; background: var(--sunk); border-radius: 10px;
    font-size: 12.5px; color: var(--soft); line-height: 1.5; }

  .reglage { display: flex; align-items: center; gap: 12px; background: var(--card);
    border: 1px solid var(--rule); border-radius: 12px; padding: 14px 15px;
    margin-bottom: 8px; width: 100%; text-align: left; }
  .reglage .val { margin-left: auto; color: var(--faint); font-size: 14px; }

  /* ---------- Pro ---------- */

  .bloc { background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    padding: 17px; margin-bottom: 12px; }
  .bloc-titre { font-family: var(--mono); font-size: 10px; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--faint); margin: 0 0 11px; }
  .chiffres { display: flex; gap: 24px; }
  .chiffres div { display: flex; flex-direction: column; }
  .chiffres .v { font-family: var(--mono); font-size: 25px; font-weight: 700; color: var(--green);
    font-variant-numeric: tabular-nums; line-height: 1.1; }
  .chiffres .l { font-size: 12px; color: var(--faint); }
  .maj { font-size: 13px; color: var(--soft); margin: 10px 0 0; }
  .manques { border-color: var(--corail); }
  .manques .bloc-titre { color: var(--corail); }
  .manque-ligne { display: flex; align-items: center; gap: 11px; padding: 10px 0;
    border-bottom: 1px solid var(--rule); }
  .manque-ligne:last-of-type { border-bottom: none; }
  .manque-nb { font-family: var(--mono); font-weight: 700; color: var(--corail); font-size: 17px;
    min-width: 26px; font-variant-numeric: tabular-nums; }
  .manque-lait { font-weight: 600; font-size: 14.5px; }
  .manque-marque { font-size: 12px; color: var(--faint); }
  .encart-vente { margin-top: 12px; padding: 12px 14px; background: var(--corail-wash);
    border-radius: 10px; font-size: 13px; color: var(--soft); line-height: 1.5; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--card); padding: 14px; }
  .stat .v { font-family: var(--mono); font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums; display: block; line-height: 1.15; }
  .stat .l { font-size: 12px; color: var(--soft); line-height: 1.35; }
  .fiche-ligne { display: flex; gap: 10px; padding: 8px 0; font-size: 14.5px; }
  .fiche-ligne .k { color: var(--faint); min-width: 92px; font-size: 13px; }

  .recap-marque { background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 8px; }
  .recap-nom { font-weight: 700; font-size: 15px; display: flex; align-items: baseline;
    gap: 10px; margin-bottom: 8px; }
  .recap-nb { font-family: var(--mono); font-size: 11px; color: var(--faint); font-weight: 400;
    margin-left: auto; font-variant-numeric: tabular-nums; }
  .recap-refs { display: flex; flex-wrap: wrap; gap: 6px; }
  .puce { font-size: 12.5px; background: var(--wash); color: var(--green);
    padding: 4px 9px; border-radius: 7px; font-weight: 600; }

  .avancement { display: flex; align-items: center; gap: 11px; margin: 14px 0 4px; }
  .jauge { flex: 1; height: 5px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
  .jauge-remplie { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.28s ease; }
  .compteur { font-family: var(--mono); font-size: 12px; color: var(--soft);
    font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Navigation basse ---------- */

  .bas { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--rule); display: flex; padding: 8px 6px 12px; }
  .onglet { flex: 1; background: none; border: none; padding: 6px 4px; font-size: 11px; color: var(--faint); }
  .onglet[aria-current="true"] { color: var(--green); font-weight: 700; }

  .legende { max-width: 412px; width: 100%; color: #7d8c84; font-size: 12.5px;
    line-height: 1.6; text-align: center; }
  .legende b { color: #b9c7bf; }
</style>

<div class="tel">
  <div class="splash" id="splash">
    <div class="splash-logo">BIBE</div>
    <div class="splash-bl">Le lait de votre bébé, près de vous</div>
    <div class="splash-note">Touchez pour continuer</div>
  </div>
  <div class="ecran" id="ecran"></div>
  <nav class="bas" id="bas"></nav>
</div>

<p class="legende">
  <b>Maquette de démonstration.</b> Points de vente, statistiques et demandes non
  satisfaites sont fictifs. Les vignettes tiennent la place des futurs logos de marques.
</p>

<script>

  /* ===================== Navigation ===================== */

  var ONGLETS_PARENT = [["accueil","Chercher"],["mesLaits","Mes laits"],["reglages","Réglages"]];
  var ONGLETS_PRO = [["proBord","Mon espace"],["marques","Mes références"],["reglages","Réglages"]];

  function rendreBas() {
    var ong = S.role === "pro" ? ONGLETS_PRO : ONGLETS_PARENT;
    var visibles = {};
    ong.forEach(function (o) { visibles[o[0]] = 1; });
    $b.style.display = (S.role && visibles[S.vue]) ? "flex" : "none";
    $b.innerHTML = ong.map(function (o) {
      return '<button class="onglet" data-va="' + o[0] + '" aria-current="' +
        (S.vue === o[0] ? "true" : "false") + '">' + o[1] + "</button>";
    }).join("");
  }

  function rendre() {
    $e.innerHTML = V[S.vue]();
    $e.scrollTop = 0;
    rendreBas();
    brancher();
  }

  function aller(v) { S.vue = v; rendre(); }

  function memoriser(l) {
    // Sans compte, la recherche reste libre mais ne laisse aucune trace :
    // memoriser un lait est precisement ce que le compte apporte.
    if (!S.compte) return;
    if (!S.enfants.length) S.enfants.push({ prenom: "", laits: [] });
    var e = S.enfants[S.enfantActif] || S.enfants[0];
    var deja = e.laits.some(function (x) { return x.marque === l.marque && x.produit === l.produit; });
    if (!deja) e.laits.push({ marque: l.marque, produit: l.produit });
  }

  function basculer() { S.sombre = !S.sombre; ecrireT(S.sombre ? "dark" : "light"); appliquerT(); rendre(); }

  function brancher() {
    [$e, $b].forEach(function (z) {
      z.querySelectorAll("[data-va]").forEach(function (b) {
        b.addEventListener("click", function () { aller(b.dataset.va); });
      });
    });

    var t1 = $("theme"); if (t1) t1.addEventListener("click", basculer);
    var t2 = $("theme2"); if (t2) t2.addEventListener("click", basculer);

    $e.querySelectorAll("[data-role]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.role = b.dataset.role;
        aller(S.role === "pro" ? "proConnexion" : "accueil");
      });
    });

    $e.querySelectorAll("[data-role-reset]").forEach(function (b) {
      b.addEventListener("click", function () { S.role = null; aller("role"); });
    });

    $e.querySelectorAll("[data-lait]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = b.dataset.lait.split(":");
        S.enfantActif = +p[0];
        S.lait = S.enfants[+p[0]].laits[+p[1]];
        aller("resultats");
      });
    });

    $e.querySelectorAll("[data-lait-pour]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.enfantActif = +b.dataset.laitPour;
        aller("marques");
      });
    });

    var creer = $("creer-enfant");
    if (creer) creer.addEventListener("click", function () {
      var p1 = $("prenom-1"), p2 = $("prenom-2");
      if (p1 && p1.value.trim()) S.enfants[0].prenom = p1.value.trim();
      var nom = p2 && p2.value.trim();
      if (!nom) { p2.focus(); return; }
      S.enfants.push({ prenom: nom, laits: [] });
      S.enfantActif = S.enfants.length - 1;
      aller("marques");
    });

    // L'adresse se lit sur l'ecran ou le champ existe encore, pas au suivant.
    var ec = $("envoyer-code");
    if (ec) ec.addEventListener("click", function () {
      var m = $("mail-parent");
      S.mailSaisi = (m && m.value.trim()) || "parent@exemple.fr";
      aller("compteCode");
    });

    var vc = $("valider-compte");
    if (vc) vc.addEventListener("click", function () {
      S.compte = { email: S.mailSaisi || "parent@exemple.fr" };
      // Le lait qu'on venait de chercher est retenu dans la foulee : le parent
      // ne refait pas la recherche qu'il vient de faire.
      if (S.lait) memoriser(S.lait);
      aller("compteOk");
    });

    $e.querySelectorAll("[data-marque]").forEach(function (b) {
      b.addEventListener("click", function () { S.marqueOuverte = b.dataset.marque; aller("produits"); });
    });

    $e.querySelectorAll("[data-produit]").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = b.dataset.produit;
        if (S.role === "pro") {
          var e = decl[S.marqueOuverte];
          if (e.coches[n]) { delete e.coches[n]; e.nb--; }
          else { e.coches[n] = true; e.nb++; e.absente = false;
            var a = $("absente"); if (a) a.textContent = "Je ne travaille pas cette marque"; }
          b.setAttribute("aria-pressed", e.coches[n] ? "true" : "false");
        } else {
          S.lait = { marque: S.marqueOuverte, produit: n };
          memoriser(S.lait);
          aller("resultats");
        }
      });
    });

    var abs = $("absente");
    if (abs) abs.addEventListener("click", function () {
      var e = decl[S.marqueOuverte];
      e.absente = !e.absente;
      if (e.absente) { e.coches = {}; e.nb = 0; aller("marques"); } else { rendre(); }
    });

    $e.querySelectorAll("[data-pdv]").forEach(function (b) {
      b.addEventListener("click", function () { S.pdv = +b.dataset.pdv; aller("fiche"); });
    });

    $e.querySelectorAll("[data-eq]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = b.dataset.eq.split("|");
        S.lait = { marque: p[0], produit: p[1] };
        aller("resultats");
      });
    });

    $e.querySelectorAll("[data-rep]").forEach(function (b) {
      b.addEventListener("click", function () { aller("merci"); });
    });

    $e.querySelectorAll("[data-nav]").forEach(function (b) {
      b.addEventListener("click", function () { window.open(b.dataset.nav, "_blank", "noopener"); });
    });

    var ap = $("appeler"); if (ap) ap.addEventListener("click", function () { aller("retour"); });
    var ya = $("yaller"); if (ya) ya.addEventListener("click", function () { aller("navigation"); });
    var el = $("elargir"); if (el) el.addEventListener("click", function () { S.rayon = 10000; rendre(); });

    var f = $("filtre");
    if (f) f.addEventListener("input", function () {
      S.filtre = f.value;
      var pos = f.selectionStart;
      rendre();
      var nf = $("filtre");
      if (nf) { nf.focus(); nf.setSelectionRange(pos, pos); }
    });
  }

  /* ---------- Ouverture ---------- */

  var splash = $("splash");
  function fermerSplash() {
    if (!splash) return;
    splash.style.display = "none";
    splash = null;
  }
  $("splash").addEventListener("click", fermerSplash);
  setTimeout(fermerSplash, 1900);

  rendre();
})();
</script>

<script>
// Service worker : sert l'application hors connexion et recupere la derniere
// version des qu'un reseau est disponible.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* sans effet */ });
  });
}
</script>
