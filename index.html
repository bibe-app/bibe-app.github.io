<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIBE</title>
<meta name="description" content="Trouvez les pharmacies et parapharmacies autour de vous pour le lait de votre bébé.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F5F1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIBE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta name="bibe-version" content="0.3.1">
</head>
<body>
<style>
  :root {
    --paper: #F2F5F1; --card: #FFFFFF; --sunk: #E9EEE8;
    --ink: #14201B; --soft: #52625A; --faint: #7A8A80;
    --rule: #DCE4DD; --firm: #C2CEC5;
    --green: #0B7A52; --wash: #E0EFE7; --on-green: #FFFFFF;
    --corail: #B8421F; --corail-wash: #F8E7E2;
    --badge: #E9EEE8; --badge-sel: #C8E3D5;
    --amber: #8A5306; --amber-wash: #F6EAD8;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0C1310; --card: #151E19; --sunk: #101915;
      --ink: #E3ECE6; --soft: #A3B4AA; --faint: #7D8E84;
      --rule: #25312B; --firm: #37463E;
      --green: #34C48A; --wash: #14301F; --on-green: #062416;
      --corail: #F08A6E; --corail-wash: #351B15;
      --badge: #1F2B25; --badge-sel: #1F4231;
      --amber: #E3A95E; --amber-wash: #302516;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0C1310; --card: #151E19; --sunk: #101915;
    --ink: #E3ECE6; --soft: #A3B4AA; --faint: #7D8E84;
    --rule: #25312B; --firm: #37463E;
    --green: #34C48A; --wash: #14301F; --on-green: #062416;
    --corail: #F08A6E; --corail-wash: #351B15;
    --badge: #1F2B25; --badge-sel: #1F4231;
    --amber: #E3A95E; --amber-wash: #302516;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* L'application occupe tout l'ecran. Les zones sures (encoche, ilot,
     barre de geste, coins arrondis, paysage) sont reservees par des
     marges calculees, jamais par des valeurs fixes. */
  .app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--paper);
  }
  /* La marge basse tient compte de la barre de geste MEME sans barre de
     navigation : sur la liste des resultats, la derniere pharmacie passait
     sous le trait de l'iPhone (mesure : 779 px contre 778 px). */
  .ecran {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 calc(16px + var(--sar)) calc(24px + var(--sab)) calc(16px + var(--sal));
  }
  .ecran.avec-bas { padding-bottom: calc(96px + var(--sab)); }

  /* ---------- Ouverture ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 50; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: var(--sat) var(--sar) var(--sab) var(--sal);
  }
  .splash-logo { font-size: 46px; font-weight: 800; letter-spacing: 4px; color: var(--green); }
  .splash-bl { font-size: 15px; color: var(--soft); }

  /* ---------- Barre haute ---------- */
  .haut {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    padding: calc(12px + var(--sat)) 0 10px; display: flex; align-items: center; gap: 10px;
    min-height: 44px;
  }
  .logo { font-size: 19px; font-weight: 800; letter-spacing: 1.4px; color: var(--green); }
  /* L'etiquette reste discrete a l'oeil, mais sa zone de toucher atteint
     44 px de haut grace au pseudo-element, qui deborde sans se voir. */
  .role-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); border: 1px solid var(--rule); padding: 5px 9px; border-radius: 6px;
    background: none; min-height: 32px; position: relative; white-space: nowrap;
  }
  .role-tag::after { content: ""; position: absolute; top: -7px; bottom: -7px; left: -3px; right: -3px; }
  .retour {
    background: none; border: none; padding: 8px 8px 8px 0; color: var(--soft);
    font-size: 16px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; text-align: left;
  }
  .haut-fin { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  /* 44 px : le minimum d'une cible tactile. A 40 px, le bouton manquait
     sous le pouce. */
  .rond {
    background: var(--card); border: 1px solid var(--firm); border-radius: 999px;
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--soft);
  }

  h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 6px; line-height: 1.2; }
  h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .chapo { color: var(--soft); margin: 0 0 18px; font-size: 15px; }

  /* ---------- Blocs communs ---------- */
  .carte-choix {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 16px;
    padding: 18px; text-align: left; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .carte-choix .t { font-size: 18px; font-weight: 700; }
  .carte-choix .d { font-size: 14px; color: var(--soft); line-height: 1.45; }

  .cta {
    width: 100%; background: var(--corail); color: #fff; border: none; border-radius: 14px;
    padding: 16px; font-size: 17px; font-weight: 700; margin-top: 12px; min-height: 54px;
  }
  .cta.vert { background: var(--green); color: var(--on-green); }
  .cta:disabled { opacity: 0.45; cursor: not-allowed; }
  .cta-2 {
    width: 100%; background: none; color: var(--soft); border: 1px solid var(--firm);
    border-radius: 14px; padding: 14px; font-size: 15px; margin-top: 10px; min-height: 50px;
  }
  .aide {
    margin-top: 18px; padding: 14px 16px; background: var(--sunk); border-radius: 12px;
    font-size: 14px; color: var(--soft); line-height: 1.5;
  }
  .aide b { color: var(--ink); }
  .alerte {
    margin: 0 0 14px; padding: 12px 14px; background: var(--amber-wash); border-radius: 12px;
    font-size: 14px; color: var(--ink); line-height: 1.45; border-left: 3px solid var(--amber);
  }

  .champ {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 15px; font-size: 16px; margin-bottom: 8px;
  }
  .champ::placeholder { color: var(--faint); }

  /* ---------- Visuels des marques ---------- */
  /* Plaque blanche dans les deux themes : les logos et les boites sont
     dessines pour un fond clair. */
  .plaque {
    display: flex; align-items: center; justify-content: center; height: 58px;
    background: #FFFFFF; border-radius: 8px; padding: 7px 10px; margin-bottom: 5px;
  }
  .plaque img { display: block; max-width: 100%; max-height: 44px; object-fit: contain; }
  .vignette { flex: none; width: 56px; height: 56px; border-radius: 8px; background: #FFFFFF; object-fit: contain; }
  .vignette.vide { background: var(--sunk); }
  img.rate { visibility: hidden; }
  .plaque:has(img.rate) { display: none; }
  .ligne.avec-vignette { padding-top: 8px; padding-bottom: 8px; }
  .equiv.avec-vignette { display: flex; align-items: center; gap: 12px; }

  /* ---------- Lait choisi ---------- */
  .bandeau-lait { background: var(--wash); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .bandeau-lait .vignette { width: 64px; height: 64px; }
  .bandeau-lait .m { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.05em; }
  .bandeau-lait .p { font-weight: 700; font-size: 17px; }
  .bandeau-lait .s { font-size: 13px; color: var(--soft); }

  /* ---------- Catalogue ---------- */
  /* Un bandeau plein par famille : avec 36 marques et leurs logos, le petit
     intertitre gris se perdait entre les cartes. La couleur reprend celle
     des boites de chaque famille (bleu, vert, violet pour la chevre, ambre
     pour les preparations medicales). */
  .famille {
    display: flex; align-items: baseline; gap: 10px;
    margin: 24px 0 10px; padding: 10px 14px; border-radius: 11px;
    border-left: 4px solid var(--fam-trait); background: var(--fam-fond); color: var(--fam-texte);
    font-size: 15px; font-weight: 700; line-height: 1.3;
  }
  /* Le titre occupe la place restante et se coupe en deux lignes si besoin ;
     le compte reste en face de lui, jamais renvoye seul en dessous. */
  .famille .titre-fam { flex: 1; min-width: 0; }
  .famille .nb-marques { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 400; white-space: nowrap; }
  .famille[data-fam="courantes"] { --fam-fond: #E4EDF6; --fam-trait: #2C5F94; --fam-texte: #1B3E61; }
  .famille[data-fam="bio"]       { --fam-fond: #E3F0E2; --fam-trait: #3F7D34; --fam-texte: #274E21; }
  .famille[data-fam="chevre"]    { --fam-fond: #EDE6F3; --fam-trait: #6B4E96; --fam-texte: #43305F; }
  .famille[data-fam="medicales"] { --fam-fond: #F6EAD8; --fam-trait: #8A5306; --fam-texte: #5C3804; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .famille[data-fam="courantes"] { --fam-fond: #14222F; --fam-trait: #5B9BD5; --fam-texte: #C3DAEE; }
    :root:not([data-theme="light"]) .famille[data-fam="bio"]       { --fam-fond: #16281A; --fam-trait: #67B457; --fam-texte: #C6E4BE; }
    :root:not([data-theme="light"]) .famille[data-fam="chevre"]    { --fam-fond: #241C30; --fam-trait: #A98AD1; --fam-texte: #DCCFEC; }
    :root:not([data-theme="light"]) .famille[data-fam="medicales"] { --fam-fond: #302516; --fam-trait: #E3A95E; --fam-texte: #EDD6B2; }
  }
  :root[data-theme="dark"] .famille[data-fam="courantes"] { --fam-fond: #14222F; --fam-trait: #5B9BD5; --fam-texte: #C3DAEE; }
  :root[data-theme="dark"] .famille[data-fam="bio"]       { --fam-fond: #16281A; --fam-trait: #67B457; --fam-texte: #C6E4BE; }
  :root[data-theme="dark"] .famille[data-fam="chevre"]    { --fam-fond: #241C30; --fam-trait: #A98AD1; --fam-texte: #DCCFEC; }
  :root[data-theme="dark"] .famille[data-fam="medicales"] { --fam-fond: #302516; --fam-trait: #E3A95E; --fam-texte: #EDD6B2; }
  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .marque-carte {
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 13px 12px;
    text-align: left; font-weight: 700; font-size: 15px; min-height: 64px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .marque-carte .nb { font-size: 12px; font-weight: 400; color: var(--faint); font-family: var(--mono); }
  .marque-carte[data-etat="fait"] { border-color: var(--green); background: var(--wash); }
  .marque-carte[data-etat="fait"] .nb { color: var(--green); font-weight: 600; }
  .marque-carte[data-etat="absente"] { background: var(--sunk); border-style: dashed; opacity: 0.75; }
  .marque-carte[data-etat="absente"] .nb { color: var(--amber); }

  .groupe { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin: 18px 0 7px; }
  .ligne {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 15px; text-align: left; display: flex; align-items: center; gap: 11px;
    margin-bottom: 7px; min-height: 54px;
  }
  .ligne[aria-pressed="true"] { border-color: var(--green); background: var(--wash); }
  .ligne .nom { font-weight: 600; }
  .ligne .spec { font-size: 12px; color: var(--soft); background: var(--badge); padding: 3px 8px; border-radius: 6px; margin-left: auto; white-space: nowrap; }
  /* Le nom complet, tel qu'ecrit sur la boite, sous le nom court ; la
     particularite passe dessous : a cote de la photo, sur 320 px, elle
     ecrasait le nom. */
  .ligne .noms { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; flex: 1; gap: 2px; }
  .ligne .complet { font-size: 12px; color: var(--soft); line-height: 1.35; }
  .ligne .noms .spec { margin-left: 0; margin-top: 3px; white-space: normal; }
  .ligne[aria-pressed="true"] .spec { background: var(--badge-sel); color: var(--ink); }
  .case { flex: none; width: 24px; height: 24px; border: 2px solid var(--firm); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: transparent; }
  .ligne[aria-pressed="true"] .case { background: var(--green); border-color: var(--green); color: var(--on-green); }

  /* ---------- Localisation ---------- */
  .etat-loc { text-align: center; padding: 30px 0 10px; }
  .roue {
    width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--rule);
    border-top-color: var(--green); margin: 0 auto 18px; animation: tourne 0.9s linear infinite;
  }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .roue { animation-duration: 2.4s; } }

  /* ---------- Resultats ---------- */
  .compte-res { font-size: 14px; color: var(--soft); margin: 0 0 12px; }
  .rayons { display: flex; gap: 7px; margin: 0 0 14px; flex-wrap: wrap; }
  .puce {
    background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; color: var(--soft); min-height: 44px;
  }
  .puce[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 600; }
  /* 360 px, la largeur la plus courante sur Android : les cinq rayons
     tiennent sur une ligne au lieu de laisser « 20 km » seul en dessous. */
  @media (max-width: 380px) { .puce { padding-left: 10px; padding-right: 10px; } }
  .pdv {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    padding: 15px; text-align: left; margin-bottom: 9px; display: flex; flex-direction: column; gap: 8px;
  }
  .pdv-haut { display: flex; gap: 12px; align-items: flex-start; }
  .pdv-nom { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .pdv-adr { font-size: 13px; color: var(--soft); }
  .pdv-dist { margin-left: auto; font-family: var(--mono); font-weight: 700; color: var(--green); font-size: 15px; white-space: nowrap; padding-left: 6px; }
  .etiquettes { display: flex; flex-wrap: wrap; gap: 6px; }
  .etiquette { font-size: 12px; padding: 4px 9px; border-radius: 6px; font-weight: 600; }
  .etiquette.inconnu { background: var(--badge); color: var(--soft); font-weight: 500; }
  .etiquette.trouve { background: var(--wash); color: var(--green); }
  .etiquette.absent { background: var(--corail-wash); color: var(--corail); }
  .etiquette.para { background: var(--sunk); color: var(--faint); font-weight: 500; }

  /* ---------- Fiche ---------- */
  .fiche-actions { display: flex; gap: 9px; margin: 16px 0 14px; }
  .act-1 { flex: 2; background: var(--corail); color: #fff; border: none; border-radius: 13px; padding: 16px; font-size: 17px; font-weight: 700; min-height: 56px; }
  .act-1:disabled { background: var(--firm); color: var(--soft); }
  .act-2 { flex: 1; background: var(--wash); color: var(--green); border: none; border-radius: 13px; padding: 16px; font-size: 17px; font-weight: 700; min-height: 56px; }
  .infos { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border-radius: 12px; overflow: hidden; }
  .info { background: var(--card); padding: 13px 15px; display: flex; gap: 12px; font-size: 15px; }
  .info .k { color: var(--faint); min-width: 82px; font-size: 13px; padding-top: 2px; }
  .info a { color: var(--green); font-weight: 600; text-decoration: none; }

  .question-bloc { text-align: center; padding: 24px 0 8px; }
  .reponses { display: flex; gap: 10px; margin-top: 18px; }
  .rep { flex: 1; background: var(--card); border: 1px solid var(--firm); border-radius: 14px; padding: 18px 10px; font-size: 17px; font-weight: 700; min-height: 60px; }
  .vide-rond { width: 58px; height: 58px; border-radius: 50%; background: var(--sunk); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 24px; color: var(--faint); }
  .vide-rond.ok { background: var(--wash); color: var(--green); }

  .equiv { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 15px; margin-bottom: 8px; text-align: left; width: 100%; min-height: 54px; }
  .equiv .em { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.05em; }
  .equiv .ep { font-weight: 600; }
  .source { margin-top: 16px; padding: 13px 15px; background: var(--sunk); border-radius: 10px; font-size: 13px; color: var(--soft); line-height: 1.5; }

  .reglage { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 15px; margin-bottom: 8px; width: 100%; text-align: left; min-height: 54px; }
  .reglage .val { margin-left: auto; color: var(--faint); font-size: 14px; text-align: right; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Point de vente identifie ---------- */
  .officine-carte { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; }
  .officine-carte .t { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
  .officine-carte .n { font-weight: 700; margin-top: 3px; line-height: 1.3; }
  .officine-carte .a { font-size: 13px; color: var(--soft); margin-top: 2px; }
  .officine-carte .cta-2 { margin-top: 10px; }

  .recap-marque { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 13px 15px; margin-bottom: 8px; }
  .recap-nom { font-weight: 700; display: flex; gap: 10px; margin-bottom: 8px; }
  .recap-nb { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-left: auto; }
  .recap-refs { display: flex; flex-wrap: wrap; gap: 6px; }
  .pastille { font-size: 13px; background: var(--wash); color: var(--green); padding: 4px 10px; border-radius: 7px; font-weight: 600; }

  .avancement { display: flex; align-items: center; gap: 11px; margin: 4px 0 6px; }
  .jauge { flex: 1; height: 5px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
  .jauge-remplie { height: 100%; background: var(--green); border-radius: 3px; }
  .compteur { font-family: var(--mono); font-size: 12px; color: var(--soft); white-space: nowrap; }

  /* ---------- Navigation basse ---------- */
  .bas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
    border-top: 1px solid var(--rule); display: flex;
    padding: 6px calc(6px + var(--sar)) calc(8px + var(--sab)) calc(6px + var(--sal));
  }
  .onglet { flex: 1; background: none; border: none; padding: 10px 4px; font-size: 12px; color: var(--faint); min-height: 50px; }
  .onglet[aria-current="true"] { color: var(--green); font-weight: 700; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
    bottom: calc(96px + var(--sab)); background: var(--ink); color: var(--paper);
    padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px);
    text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.visible { opacity: 1; }
</style>

<div class="app">
  <div class="splash" id="splash">
    <div class="splash-logo">BIBE</div>
    <div class="splash-bl">Le lait de votre bébé, près de vous</div>
  </div>
  <div class="ecran" id="ecran"></div>

      : '<span class="vignette vide"></span>';
  }
  function bandeauLait(l) {
    var p = PRODUITS[cleLait(l)];
    return '<div class="bandeau-lait">' + (p && p[3] ? vignette(p) : "") + '<div><div class="m">' + ech(l.marque) +
      '</div><div class="p">' + ech(l.produit) + "</div>" + (l.spec ? '<div class="s">' + ech(l.spec) + "</div>" : "") + "</div></div>";
  }
  document.addEventListener("error", function (ev) {
    var t = ev.target;
    if (t && t.tagName === "IMG") t.classList.add("rate");
  }, true);

  function ceLieu(p) { return p[7] === 1 ? "cette parapharmacie" : "cette pharmacie"; }

  /* ================================================================== */
  /* Geolocalisation                                                      */
  /* ================================================================== */

  var SANS_GEOLOC = "La localisation n'est pas disponible ici. Indiquez une ville ou un code postal.";
  var ECHEC_LISTE = "La liste des points de vente n'a pas pu être chargée. Vérifiez votre connexion et réessayez.";

  // La position du telephone et la liste des points de vente, ensemble.
  function positionEtListe() {
    return Promise.all([
      chargerPdv(),
      new Promise(function (ok, ko) {
        // Le refus est marque comme venant de la localisation : il peut
        // arriver pendant que la liste se charge encore, et ne doit pas etre
        // pris pour une panne de chargement.
        navigator.geolocation.getCurrentPosition(ok, function (e) { ko({ geo: true, code: e && e.code }); }, {
          enableHighAccuracy: false, timeout: 15000, maximumAge: 300000
        });
      })
    ]).then(function (v) { return v[1].coords; });
  }

  /* Une page web ne peut pas ouvrir les reglages de l'appareil : une fois la
     localisation refusee, le navigateur ne la redemande plus. Tout ce que
     BIBE peut faire, c'est dire ou aller, et l'endroit n'est pas le meme
     partout. Sans cela, le message envoyait chercher un bouton qui n'existe
     nulle part. */
  function cheminAutorisation() {
    var ua = navigator.userAgent || "";
    var iOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (iOS) return "sur iPhone : Réglages, Confidentialité et sécurité, Service de localisation, Sites web Safari.";
    if (/Android/.test(ua)) return "touchez l'icône à gauche de l'adresse du site, puis Autorisations, puis Position.";
    return "cliquez sur l'icône à gauche de l'adresse du site, autorisez la position, puis rechargez la page.";
  }

  function echecPosition(err) {
    if (!err || !err.geo) return { etat: "donnees", message: ECHEC_LISTE };
    if (err.code === 1) return { etat: "refus", message: "Vous n'avez pas autorisé la localisation. Indiquez une ville ou un code postal, ou autorisez BIBE : " + cheminAutorisation() };
    if (err.code === 3) return { etat: "delai", message: "La localisation prend trop de temps. Réessayez, ou indiquez une ville ou un code postal." };
    return { etat: "indispo", message: "Votre position n'a pas pu être déterminée. Indiquez une ville ou un code postal." };
  }

  function localiser() {
    S.locEtat = "encours";
    S.locMessage = "";
    rendre();

    if (!("geolocation" in navigator)) {
      S.locEtat = "indispo";
      S.locMessage = SANS_GEOLOC;
      rendre();
      return;
    }

    positionEtListe().then(function (c) {
      S.position = { lat: c.latitude, lon: c.longitude };
      S.sourcePosition = { type: "gps", precision: Math.round(c.accuracy || 0) };
      lancerRecherche();
    }).catch(function (err) {
      var e = echecPosition(err);
      S.locEtat = e.etat;
      S.locMessage = e.message;
      rendre();
    });
  }

  function localiserManuel(texte) {
    chargerPdv().then(function () {
      var r = localiserTexte(texte);
      if (!r) {
        S.locEtat = "introuvable";
        S.locMessage = "BIBE ne reconnaît pas « " + texte + " ». Essayez un code postal à cinq chiffres ou le nom exact de la ville.";
        rendre();
        return;
      }
      S.position = r.pos;
      S.sourcePosition = { type: "manuel", libelle: r.libelle, approx: !!r.approx };
      lancerRecherche();
    }).catch(function () {
      S.locEtat = "donnees";
      S.locMessage = ECHEC_LISTE;
      rendre();
    });
  }

  function lancerRecherche() {
    var r = chercherAutour(S.position.lat, S.position.lon, S.rayon);
    S.resultats = r.resultats;
    S.rayonEffectif = r.rayon;
    S.total = r.total;
    S.locEtat = null;
    aller("resultats");
  }

  /* ================================================================== */
  /* Identification du point de vente qui declare                         */
  /* ================================================================== */

  var MAX_CANDIDATS_AUTOUR = 12;
  var MAX_LISTE_VILLE = 80;

  function trierParNom(liste) {
    return liste.slice().sort(function (a, b) { return aplatir(a[0]).localeCompare(aplatir(b[0]), "fr"); })
      .map(function (p) { return { p: p, d: null }; });
  }

  /* Par code postal ou par ville : tous les points de vente du lieu, par
     ordre alphabetique. Au comptoir, on cherche son nom, pas une distance
     a un centre-ville calcule. */
  function candidatsDuLieu(texte) {
    var t = aplatir(texte), idx = indexLieux();
    if (/^\d{5}$/.test(t)) {
      if (!idx.cp[t]) return { erreur: "BIBE ne connaît aucun point de vente au " + t + ". Vérifiez le code postal, ou essayez le nom de votre ville." };
      return { liste: trierParNom(idx.cp[t]), libelle: "au " + t };
    }
    var v = t ? cleVille(t) : null;
    if (!v) return { erreur: "BIBE ne reconnaît pas « " + texte + " ». Essayez votre code postal à cinq chiffres." };
    var l = idx.ville[v];
    if (l.length > MAX_LISTE_VILLE) {
      return { erreur: l[0][3] + " compte " + l.length + " points de vente : indiquez plutôt votre code postal." };
    }
    return { liste: trierParNom(l), libelle: "à " + l[0][3] };
  }

  function localiserOfficine() {
    S.offEtat = "encours";
    S.offMessage = "";
    rendre();
    if (!("geolocation" in navigator)) {
      S.offEtat = null;
      S.offMessage = SANS_GEOLOC;
      rendre();
      return;
    }
    positionEtListe().then(function (c) {
      S.offEtat = null;
      // Parti sur un autre ecran entre-temps : on ne l'y arrache pas.
      if (S.vue !== "proOfficine") return;
      S.offListe = chercherAutour(c.latitude, c.longitude, 1).resultats.slice(0, MAX_CANDIDATS_AUTOUR);
      S.offGps = true;
      S.offLieu = "";
      S.offFiltre = "";
      aller("proOfficineListe");
    }).catch(function (err) {
      S.offEtat = null;
      S.offMessage = echecPosition(err).message;
      if (S.vue === "proOfficine") rendre();
    });
  }

  function chercherOfficine(texte) {
    chargerPdv().then(function () {
      var r = candidatsDuLieu(texte);
      if (r.erreur) { S.offMessage = r.erreur; rendre(); return; }
      S.offMessage = "";
      S.offListe = r.liste;
      S.offGps = false;
      S.offLieu = r.libelle;
      S.offFiltre = "";
      aller("proOfficineListe");
    }).catch(function () {
      S.offMessage = ECHEC_LISTE;
      rendre();
    });
  }

  function adresseOfficine(o) {
    return [o.adresse, [o.cp, o.ville].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  }

  /* ================================================================== */
  /* Inscription du point de vente                                        */
  /* ================================================================== */

  /* Le numero demande depend du registre qui permet de verifier : les
     pharmaciens sont inscrits au repertoire des professionnels de sante,
     les parapharmacies seulement au registre des entreprises. */
  function quelNumero() {
    var para = S.officine && S.officine.type === 1;
    return para
      ? { cle: "siret", titre: "Le SIRET de votre magasin", aide: "14 chiffres. Il figure sur vos factures et sur votre extrait d'immatriculation.",
          motif: /^\d{14}$/, erreur: "Un SIRET compte 14 chiffres.", mode: "numeric" }
      : { cle: "rpps", titre: "Votre numéro RPPS", aide: "11 chiffres. C'est votre numéro de professionnel de santé, celui qui figure sur vos ordonnances.",
          motif: /^\d{11}$/, erreur: "Un numéro RPPS compte 11 chiffres.", mode: "numeric" };
  }

  // Une adresse doit ressembler a une adresse : ni plus, ni moins. Le seul
  // vrai controle, c'est que le code y arrive.
  function emailPlausible(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v || "").trim()); }

  function etatPro() {
    var p = S.pro, o = S.officine;
    if (!p || !o || p.pdv !== o.id) return "aucun";
    return p.etat || "aucun";
  }

  function oublierPro() { S.pro = null; effacer("pro"); }

  function demanderCode() {
    var n = quelNumero(), num = S.proNumero.replace(/[\s.-]/g, ""), mail = S.proEmail.trim();
    if (!n.motif.test(num)) { S.proMessage = n.erreur; rendre(); return; }
    if (!emailPlausible(mail)) { S.proMessage = "Cette adresse ne ressemble pas à une adresse électronique."; rendre(); return; }
    S.proMessage = "";
    S.proEnvoi = "encours";
    rendre();
    appelServeur("/inscription", {
      pdv: S.officine.id, type: S.officine.type, cle: n.cle, numero: num, email: mail
    }).then(function () {
      S.pro = { pdv: S.officine.id, etat: "demande", email: mail };
      ecrire("pro", S.pro);
      S.proEnvoi = null;
      S.proNumero = "";
      aller("proAttente");
    }).catch(function (e) {
      S.proEnvoi = null;
      S.proMessage = e && e.horsService
        ? "Les inscriptions ne sont pas encore ouvertes. Elles le seront au lancement."
        : "La demande n'est pas partie. Vérifiez votre connexion et réessayez.";
      rendre();
    });
  }

  function envoyerCode() {
    var code = S.proCode.replace(/[\s-]/g, "").toUpperCase();
    if (code.length < 6) { S.proMessage = "Le code compte six caractères."; rendre(); return; }
    S.proMessage = "";
    S.proEnvoi = "encours";
    rendre();
    appelServeur("/code", { pdv: S.officine.id, code: code }).then(function (d) {
      S.proEnvoi = null;
      if (!d.jeton) {
        S.proMessage = "Ce code n'est pas le bon. Vérifiez-le, ou demandez-en un nouveau.";
        rendre();
        return;
      }
      S.pro = { pdv: S.officine.id, etat: "valide", email: (S.pro || {}).email || "", jeton: d.jeton };
      ecrire("pro", S.pro);
      S.proCode = "";
      toast("Votre point de vente est vérifié");
      aller("marques");
    }).catch(function (e) {
      S.proEnvoi = null;
      S.proMessage = e && e.horsService
        ? "Les inscriptions ne sont pas encore ouvertes. Elles le seront au lancement."
        : "La vérification n'a pas abouti. Vérifiez votre connexion et réessayez.";
      rendre();
    });
  }

  /* ================================================================== */
  /* Ecrans                                                               */
  /* ================================================================== */

  function haut(titre, versArriere) {
    var etiquette = S.role
      ? '<button class="role-tag" data-role-reset="1" aria-label="Changer de profil">' +
        (S.role === "pro" ? "Point de vente" : "Parent") + " ⌄</button>"
      : "";
    var g = versArriere
      ? '<button class="retour" data-va="' + versArriere + '">‹ ' + ech(titre) + "</button>"
      : '<span class="logo">BIBE</span>' + etiquette;
    return '<div class="haut">' + g + '<span class="haut-fin">' + (versArriere ? etiquette : "") +
      '<button class="rond" id="theme" aria-label="' + (S.sombre ? "Passer en mode clair" : "Passer en mode sombre") + '">' +
      (S.sombre ? SOLEIL : LUNE) + "</button></span></div>";
  }

  var V = {};

  V.role = function () {
    return haut() + "<h1>Vous êtes…</h1>" +
      '<p class="chapo">Cette question ne vous sera posée qu\'une fois.</p>' +
      '<button class="carte-choix" data-role="parent"><span class="t">Un parent</span>' +
      '<span class="d">Trouver les pharmacies et parapharmacies autour de vous, avec leur numéro et l\'itinéraire.</span></button>' +
      '<button class="carte-choix" data-role="pro"><span class="t">Un point de vente</span>' +
      '<span class="d">Pharmacie ou parapharmacie : déclarez les laits que vous référencez.</span></button>' +
      '<div class="aide">BIBE est gratuit. Vous pourrez changer de profil à tout moment.</div>';
  };

  /* ---------------- Parent ---------------- */

  V.accueil = function () {
    return haut() + "<h1>Où trouver le lait de votre bébé&nbsp;?</h1>" +
      '<p class="chapo">Choisissez le lait, BIBE cherche les pharmacies et parapharmacies autour de vous.</p>' +
      '<button class="cta" data-va="marques">Chercher un lait</button>' +
      '<button class="cta-2" id="sans-lait">Voir les pharmacies autour de moi</button>' +
      '<div class="aide"><b>Ce que BIBE sait aujourd\'hui :</b> où sont les pharmacies et ' +
      "parapharmacies, leur numéro, leur adresse. <b>Ce qu'il ne sait pas encore :</b> " +
      "lesquelles proposent votre lait. Appelez avant de vous déplacer.</div>";
  };

  V.marques = function () {
    var pro = S.role === "pro";
    var h = haut("Retour", pro ? "proAccueil" : "accueil");
    h += "<h1>" + (pro ? "Vos références" : "Quel lait&nbsp;?") + "</h1>";
    if (pro) {
      var t = traitees();
      h += '<p class="chapo">Ouvrez les marques que vous travaillez, cochez vos références.</p>' +
        '<div class="avancement"><div class="jauge"><div class="jauge-remplie" style="width:' +
        (t / MARQUES.length * 100) + '%"></div></div><span class="compteur">' + t + " / " + MARQUES.length + "</span></div>";
    }
    h += '<input class="champ" id="filtre" type="search" autocomplete="off" enterkeyhint="search" ' +
      'placeholder="Marque, lait ou besoin (AR, bio, chèvre…)" value="' + ech(S.filtre) + '">';

    var q = aplatir(S.filtre), vide = true;
    FAMILLES.forEach(function (f) {
      var ms = f.marques.filter(function (m) {
        if (!q) return true;
        if (aplatir(f.libelle).indexOf(q) >= 0 || aplatir(m.nom).indexOf(q) >= 0) return true;
        // Le nom complet compte aussi : « Blédigest » trouve le lait rangé
        // sous son ancien nom, celui des équivalences SFP.
        return m.produits.some(function (p) {
          return aplatir(p[0]).indexOf(q) >= 0 || aplatir(p[2]).indexOf(q) >= 0 || aplatir(p[4]).indexOf(q) >= 0;
        });
      });
      if (!ms.length) return;
      vide = false;
      h += '<p class="famille" data-fam="' + ech(f.cle) + '"><span class="titre-fam">' + ech(f.libelle) +
        '</span><span class="nb-marques">' + compte(ms.length, "marque") + "</span></p><div class=\"grille\">";
      ms.forEach(function (m) {
        var e = S.decl[m.nom], et = "", lib = m.produits.length + " réf.";
        if (pro && e.absente) { et = "absente"; lib = "non travaillée"; }
        else if (pro && e.nb > 0) { et = "fait"; lib = e.nb + " cochée" + (e.nb > 1 ? "s" : ""); }
        h += '<button class="marque-carte" data-etat="' + et + '" data-marque="' + ech(m.nom) + '">' +
          (m.logo ? '<span class="plaque"><img src="' + ech(m.logo) + '" alt="" loading="lazy" decoding="async"></span>' : "") +
          ech(m.nom) + '<span class="nb">' + lib + "</span></button>";
      });
      h += "</div>";
    });
    if (vide) h += '<div class="aide">Aucun résultat. Essayez le nom de la marque seule.</div>';
    if (pro) {
      h += '<button class="cta vert" data-va="proEnvoi"' + (totalRefs() ? "" : " disabled") + ">" +
        "C'est bon pour moi</button>";
    }
    return h;
  };

  V.produits = function () {
    var m = MARQUES.filter(function (x) { return x.nom === S.marqueOuverte; })[0];
    if (!m) return V.marques();
    var pro = S.role === "pro", e = S.decl[m.nom];
    // Une colonne de vignettes seulement si la marque a des photos.
    var avecImg = m.produits.some(function (p) { return !!p[3]; });
    var h = haut("Marques", "marques") + "<h1>" + ech(m.nom) + "</h1>" +
      '<p class="chapo">' + (pro ? "Cochez ce que vous avez habituellement en rayon." : "Choisissez la référence exacte.") + "</p>";
    ORDRE_AGES.forEach(function (age) {
      var g = m.produits.filter(function (p) { return p[1] === age; });
      if (!g.length) return;
      h += '<p class="groupe">' + age + "</p>";
      g.forEach(function (p) {
        h += '<button class="ligne' + (avecImg ? " avec-vignette" : "") + '" data-produit="' + ech(p[0]) + '" data-spec="' + ech(p[2] || "") + '"' +
          (pro ? ' aria-pressed="' + (e.coches[p[0]] ? "true" : "false") + '"' : "") + ">" +
          (pro ? '<span class="case">✓</span>' : "") + (avecImg ? vignette(p) : "") +
          '<span class="noms"><span class="nom">' + ech(p[0]) + "</span>" +
          (p[4] ? '<span class="complet">' + ech(p[4]) + "</span>" : "") +
          (p[2] ? '<span class="spec">' + ech(p[2]) + "</span>" : "") + "</span></button>";
      });
    });
    if (pro) {
      h += '<button class="cta vert" data-va="marques">C\'est bon pour cette marque</button>' +
        '<button class="cta-2" id="absente">' +
        (e.absente ? "Finalement, je travaille cette marque" : "Je ne travaille pas cette marque") + "</button>";
    }
    return h;
  };

  V.localisation = function () {
    var h = haut("Retour", S.lait ? "produits" : "accueil");
    if (S.lait) h += bandeauLait(S.lait);
    if (S.locEtat === "encours") {
      return h + '<div class="etat-loc"><div class="roue" aria-hidden="true"></div>' +
        "<h2>Recherche de votre position</h2>" +
        '<p class="chapo">Autorisez la localisation si votre téléphone vous le demande.</p></div>';
    }
    h += "<h1>Où cherchez-vous&nbsp;?</h1>";
    if (S.locMessage) h += '<div class="alerte">' + ech(S.locMessage) + "</div>";
    h += '<button class="cta" id="me-localiser">Autour de moi</button>' +
      '<p class="groupe" style="margin-top:24px">Ou autour d\'un lieu</p>' +
      '<input class="champ" id="lieu" type="text" autocomplete="postal-code" enterkeyhint="search" ' +
      'placeholder="Code postal ou ville">' +
      '<button class="cta-2" id="chercher-lieu">Chercher autour de ce lieu</button>' +
      '<div class="aide">Votre position sert uniquement à trier les pharmacies par distance. ' +
      "Elle reste sur votre téléphone : BIBE ne l'envoie nulle part.</div>";
    return h;
  };

  V.resultats = function () {
    var l = S.lait;
    var h = haut("Retour", "accueil");
    if (l) h += bandeauLait(l);

    var src = S.sourcePosition;
    var ou = src && src.type === "manuel" ? "autour de " + ech(src.libelle) : "autour de vous";
    var n = S.resultats.length;

    if (!n) {
      return h + '<div class="question-bloc"><div class="vide-rond">·</div>' +
        "<h2>Aucun point de vente trouvé</h2>" +
        '<p class="chapo">Même à ' + RAYON_MAX + "&nbsp;km " + ou + ", BIBE ne connaît aucun point de vente.</p></div>" +
        '<button class="cta-2" data-va="localisation">Chercher ailleurs</button>';
    }

    // La liste s'arrete aux 60 plus proches : en ville il y en a bien plus
    // dans le rayon, et le compte affiche ne doit pas laisser croire le contraire.
    h += '<p class="compte-res"><b>' + (S.total > n ? "Les " + n + " plus proches" :
      n + " point" + (n > 1 ? "s" : "") + " de vente") + "</b> " + ou +
      ", à moins de " + S.rayonEffectif + "&nbsp;km.</p>";

    if (S.rayonEffectif > S.rayon) {
      h += '<div class="alerte">Moins de ' + MIN_RESULTATS + " points de vente à moins de " + S.rayon +
        "&nbsp;km : la recherche a été élargie à " + S.rayonEffectif + "&nbsp;km.</div>";
    }

    h += '<div class="rayons" role="group" aria-label="Rayon de recherche">';
    RAYONS.forEach(function (r) {
      h += '<button class="puce" data-rayon="' + r + '" aria-pressed="' + (S.rayon === r ? "true" : "false") + '">' + r + " km</button>";
    });
    h += "</div>";

    if (l) {
      h += '<div class="alerte">BIBE ne sait pas encore quels points de vente proposent ce lait. ' +
        "<b>Appelez avant de vous déplacer.</b></div>";
    }

    S.resultats.forEach(function (r, i) {
      var p = r.p, ret = l ? S.retours[idPdv(p) + "|" + cleLait(l)] : null;
      h += '<button class="pdv" data-pdv="' + i + '"><span class="pdv-haut"><span>' +
        '<span class="pdv-nom">' + ech(p[0]) + '</span><br><span class="pdv-adr">' +
        ech([p[1], p[3]].filter(Boolean).join(", ")) + '</span></span><span class="pdv-dist">' +
        formaterDist(r.d) + '</span></span><span class="etiquettes">';
      if (ret && ret.v === "oui") h += '<span class="etiquette trouve">Trouvé ici le ' + ech(ret.date) + "</span>";
      else if (ret && ret.v === "non") h += '<span class="etiquette absent">Absent le ' + ech(ret.date) + "</span>";
      else if (l) h += '<span class="etiquette inconnu">Référencement non déclaré</span>';
      if (p[7] === 1) h += '<span class="etiquette para">Parapharmacie</span>';
      if (!p[4]) h += '<span class="etiquette para">Pas de numéro connu</span>';
      h += "</span></button>";
    });

    if (l) h += '<button class="cta-2" data-va="equivalents">Voir les équivalents de ce lait</button>';
    return h;
  };

  V.fiche = function () {
    var r = S.resultats[S.pdv];
    if (!r) return V.resultats();
    var p = r.p;
    var h = haut("Résultats", "resultats") + "<h1>" + ech(p[0]) + "</h1>" +
      '<p class="chapo">' + ech([p[1], [p[2], p[3]].filter(Boolean).join(" ")].filter(Boolean).join(", ")) + "</p>";
    h += '<div class="fiche-actions">' +
      (p[4] ? '<a class="act-1" id="appeler" href="' + telLien(p[4]) + '" style="text-align:center;text-decoration:none">Appeler</a>'
            : '<button class="act-1" disabled>Pas de numéro</button>') +
      '<button class="act-2" data-va="navigation">Y aller</button></div>';

  V.navigation = function () {

  V.equivalents = function () {

          (p && p[3] ? vignette(p) + "<span>" : "") + '<span class="em">' +

  V.mesLaits = function () {

  V.reglages = function () {

  /* ---------------- Point de vente ---------------- */

  function traitees() { return MARQUES.filter(function (m) { var e = S.decl[m.nom]; return e.absente || e.nb > 0; }).length; }
  function totalRefs() { return MARQUES.reduce(function (t, m) { return t + S.decl[m.nom].nb; }, 0); }
  function mqRetenues() { return MARQUES.filter(function (m) { return S.decl[m.nom].nb > 0; }).length; }
  function compte(n, mot) { return n + " " + mot + (n > 1 ? "s" : ""); }
  function resumeDecl() { return compte(totalRefs(), "référence") + " sur " + compte(mqRetenues(), "marque") + "."; }

  // Le point de vente retenu, avec de quoi en changer. « retour » : l'ecran
  // ou revenir une fois le choix fait.
  function blocOfficine(retour) {
    var o = S.officine;
    if (!o) {
      return '<div class="officine-carte"><div class="t">Votre point de vente</div>' +
        '<div class="n">Pas encore indiqué</div>' +
        '<button class="cta-2" data-officine="' + retour + '">Indiquer mon point de vente</button></div>';
    }
    if (o.absente) {
      return '<div class="officine-carte"><div class="t">Votre point de vente</div>' +
        '<div class="n">Absent de la liste publique</div>' +
        '<div class="a">Ajoutez son nom, sa ville et son téléphone au message qui accompagne votre déclaration.</div>' +
        '<button class="cta-2" data-officine="' + retour + '">Le chercher à nouveau</button></div>';
    }
    return '<div class="officine-carte"><div class="t">Votre point de vente</div>' +
      '<div class="n">' + ech(o.nom) + '</div><div class="a">' + ech(adresseOfficine(o)) + "</div>" +
      '<button class="cta-2" data-officine="' + retour + '">Changer de point de vente</button></div>';
  }

  V.proAccueil = function () {
    var o = S.officine, etat = etatPro();
    var h = haut() + "<h1>Votre espace</h1>" +
      '<p class="chapo">Indiquez les laits infantiles que vous référencez. Moins de deux minutes.</p>';
    // Sans serveur, l'inscription ne peut pas aboutir : on ne la montre pas
    // du tout, plutot que d'ouvrir une porte qui ne mene nulle part. Le
    // parcours reste alors celui d'avant, la declaration se copie.
    if (!serveurPret()) {
      h += '<div class="alerte"><b>Phase pilote.</b> ' +
        (CONTACT_DECLARATIONS ? "Votre déclaration nous est transmise à la fin, "
          : "À la fin, vous copiez votre déclaration pour l'envoyer à la personne qui vous a présenté BIBE, ") +
        "et vous serez parmi les premiers visibles au lancement.</div>";
    }
    h += (o ? blocOfficine("proAccueil") : "");
    // Cocher ses references ne demande aucune verification : on ne bloque
    // qu'au moment d'envoyer. Un pharmacien doit pouvoir regarder et
    // preparer avant de prouver quoi que ce soit.
    h += '<button class="cta vert" ' + (o ? 'data-va="marques"' : 'data-officine="marques"') +
      ">Déclarer mes références</button>";
    if (serveurPret() && o && !o.absente) h += blocVerification();
    h += '<div class="aide">BIBE ne se connecte pas à votre logiciel d\'officine et n\'affiche jamais de stock. ' +
      "Il indiquera aux parents quelles pharmacies référencent leur lait, et les invitera à vous appeler.</div>";
    return h;
  };

  /* Etat de la verification, montre a l'accueil et au recapitulatif. */

      return '<div class="officine-carte"><div class="t">Vérification</div>' +
        '<div class="n">Votre demande est en cours</div>' +
        '<div class="a">Votre code arrivera par courrier électronique.</div>' +
        '<button class="cta-2" data-va="proCodeSaisie">J\'ai reçu mon code</button></div>';
    }
    return '<div class="officine-carte"><div class="t">Vérification</div>' +
      '<div class="n">Pas encore vérifié</div>' +
      '<div class="a">Vos déclarations seront visibles des parents une fois votre point de vente vérifié.</div>' +
      '<button class="cta-2" data-va="proInscription">Vérifier mon point de vente</button></div>';
  }

  V.proInscription = function () {

  V.proAttente = function () {

  function recapitulatif() {
    var o = S.officine, connue = o && !o.absente;
    var lignes = ["Déclaration BIBE", ""];
    if (connue) {
      lignes.push(o.nom);

      lignes.push("Téléphone : " + (o.tel || ""));
      lignes.push("");
    }
    MARQUES.forEach(function (m) {
      var e = S.decl[m.nom];
      if (!e.nb) return;
      var refs = m.produits.filter(function (p) { return e.coches[p[0]]; }).map(function (p) { return p[0]; });
      lignes.push(m.nom + " : " + refs.join(", "));
    });
    var absentes = MARQUES.filter(function (m) { return S.decl[m.nom].absente; }).map(function (m) { return m.nom; });
    if (absentes.length) { lignes.push(""); lignes.push("Marques non travaillées : " + absentes.join(", ")); }
    lignes.push("");
    lignes.push(resumeDecl());
    // Sans point de vente reconnu, les trois lignes restent a remplir a la main.
    if (!connue) {
      lignes.push("");
      lignes.push("Nom du point de vente :");
      lignes.push("Ville :");
      lignes.push("Téléphone :");
    }
    return lignes.join("\n");

  V.proEnvoi = function () {
    var h = haut("Mes références", "marques") + "<h1>Votre déclaration</h1>" +

  /* ================================================================== */

  /* ================================================================== */

  var ONGLETS_PARENT = [["accueil", "Chercher"], ["mesLaits", "Mes laits"], ["reglages", "Réglages"]];
  var ONGLETS_PRO = [["proAccueil", "Mon espace"], ["marques", "Références"], ["reglages", "Réglages"]];

  function rendreBas() {
    var ong = S.role === "pro" ? ONGLETS_PRO : ONGLETS_PARENT;
    var principal = ong.some(function (o) { return o[0] === S.vue; });
    var visible = !!S.role && principal;
    $b.style.display = visible ? "flex" : "none";
    $e.classList.toggle("avec-bas", visible);
    $b.innerHTML = ong.map(function (o) {
      return '<button class="onglet" data-va="' + o[0] + '" aria-current="' + (S.vue === o[0] ? "true" : "false") + '">' + o[1] + "</button>";
    }).join("");
  }

  function rendre() {
    var fn = V[S.vue] || V.accueil;
    $e.innerHTML = fn();
    $e.scrollTop = 0;
    rendreBas();
    brancher();
  }

  function aller(v) { S.vue = v; rendre(); }

  function aujourdhui() {
    var d = new Date();
    return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2);
  }

  function brancher() {
    [$e, $b].forEach(function (z) {
      z.querySelectorAll("[data-va]").forEach(function (b) {
        b.addEventListener("click", function () { aller(b.dataset.va); });
      });
    });

    var t1 = $("theme"); if (t1) t1.addEventListener("click", basculerTheme);
    var t2 = $("theme2"); if (t2) t2.addEventListener("click", basculerTheme);

    $e.querySelectorAll("[data-role]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.role = b.dataset.role;
        ecrire("role", S.role);
        aller(S.role === "pro" ? "proAccueil" : "accueil");
      });
    });
    $e.querySelectorAll("[data-role-reset]").forEach(function (b) {
      b.addEventListener("click", function () { S.role = null; ecrire("role", null); aller("role"); });
    });

    var sl = $("sans-lait");
    if (sl) sl.addEventListener("click", function () { S.lait = null; S.locMessage = ""; aller("localisation"); });

    $e.querySelectorAll("[data-marque]").forEach(function (b) {
      b.addEventListener("click", function () { S.marqueOuverte = b.dataset.marque; aller("produits"); });
    });

    $e.querySelectorAll("[data-produit]").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = b.dataset.produit;
        if (S.role === "pro") {
          var e = S.decl[S.marqueOuverte];
          if (e.coches[n]) { delete e.coches[n]; e.nb--; }
          else { e.coches[n] = true; e.nb++; e.absente = false; var a = $("absente"); if (a) a.textContent = "Je ne travaille pas cette marque"; }
          b.setAttribute("aria-pressed", e.coches[n] ? "true" : "false");
          ecrire("decl", S.decl);
        } else {
          S.lait = { marque: S.marqueOuverte, produit: n, spec: b.dataset.spec || "" };
          S.locMessage = "";
          aller("localisation");
        }
      });
    });

    var abs = $("absente");
    if (abs) abs.addEventListener("click", function () {
      var e = S.decl[S.marqueOuverte];
      e.absente = !e.absente;
      if (e.absente) { e.coches = {}; e.nb = 0; }
      ecrire("decl", S.decl);
      if (e.absente) aller("marques"); else rendre();
    });

    var ml = $("me-localiser"); if (ml) ml.addEventListener("click", localiser);

    var cl = $("chercher-lieu"), champLieu = $("lieu");
    function lancerLieu() {
      var v = champLieu.value.trim();
      if (!v) { champLieu.focus(); return; }
      champLieu.blur();
      localiserManuel(v);
    }
    if (cl) cl.addEventListener("click", lancerLieu);
    if (champLieu) champLieu.addEventListener("keydown", function (ev) { if (ev.key === "Enter") lancerLieu(); });

    $e.querySelectorAll("[data-rayon]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.rayon = +b.dataset.rayon;
        ecrire("rayon", S.rayon);
        var r = chercherAutour(S.position.lat, S.position.lon, S.rayon);
        S.resultats = r.resultats; S.rayonEffectif = r.rayon; S.total = r.total;
        rendre();
      });
    });

    $e.querySelectorAll("[data-pdv]").forEach(function (b) {
      b.addEventListener("click", function () { S.pdv = +b.dataset.pdv; aller("fiche"); });
    });

    // Comme sur la maquette validee : apres l'appel, la question attend le
    // parent. Le delai laisse le telephone ouvrir l'appel avant de changer d'ecran.
    var ap = $("appeler");
    if (ap && S.lait) ap.addEventListener("click", function () {
      setTimeout(function () { if (S.vue === "fiche") aller("retour"); }, 800);
    });

    $e.querySelectorAll("[data-rep]").forEach(function (b) {
      b.addEventListener("click", function () {
        var r = S.resultats[S.pdv];
        S.retours[idPdv(r.p) + "|" + cleLait(S.lait)] = { v: b.dataset.rep, date: aujourdhui() };
        ecrire("retours", S.retours);
        aller("merci");
      });
    });

    $e.querySelectorAll("[data-eq]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = b.dataset.eq.split("|");
        S.lait = { marque: p[0], produit: p[1], spec: "" };
        if (S.position) lancerRecherche(); else aller("localisation");
      });
    });

    var rd = $("rayon-defaut");
    if (rd) rd.addEventListener("click", function () {
      var i = RAYONS.indexOf(S.rayon);
      S.rayon = RAYONS[(i + 1) % RAYONS.length];
      ecrire("rayon", S.rayon);
      rendre();
    });

    var er = $("effacer-retours");
    if (er) er.addEventListener("click", function () { S.retours = {}; ecrire("retours", {}); toast("Vos réponses sont effacées"); rendre(); });

    // Point de vente qui declare.
    $e.querySelectorAll("[data-officine]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.offRetour = b.dataset.officine;
        S.offEtat = null;
        S.offMessage = "";
        aller("proOfficine");
      });
    });
    var og = $("officine-geo"); if (og) og.addEventListener("click", localiserOfficine);
    var oc = $("officine-chercher"), champOff = $("officine-lieu");
    function lancerOfficine() {
      var v = champOff.value.trim();
      if (!v) { champOff.focus(); return; }
      champOff.blur();
      chercherOfficine(v);
    }
    if (oc) oc.addEventListener("click", lancerOfficine);
    if (champOff) champOff.addEventListener("keydown", function (ev) { if (ev.key === "Enter") lancerOfficine(); });
    var of = $("officine-filtre");
    if (of) of.addEventListener("input", function () {
      S.offFiltre = of.value;
      var pos = of.selectionStart;
      rendre();
      var nf = $("officine-filtre");
      if (nf) { nf.focus(); try { nf.setSelectionRange(pos, pos); } catch (e) {} }
    });
    $e.querySelectorAll("[data-officine-choix]").forEach(function (b) {
      b.addEventListener("click", function () { S.offChoix = +b.dataset.officineChoix; aller("proOfficineOk"); });
    });
    var oo = $("officine-oui");
    if (oo) oo.addEventListener("click", function () {
      var p = S.offListe[S.offChoix].p;
      // L'identifiant officiel accompagne le point de vente : c'est lui qui
      // sert de cle au serveur, pas le nom ni les coordonnees.
      S.officine = { nom: p[0], adresse: p[1], cp: p[2], ville: p[3], tel: p[4], lat: p[5], lon: p[6], type: p[7], id: p[9] };
      if (etatPro() !== "valide") oublierPro();
      ecrire("officine", S.officine);
      toast("Point de vente enregistré");
      aller(S.offRetour || "marques");
    });
    var oa = $("officine-absente");
    if (oa) oa.addEventListener("click", function () {
      S.officine = { absente: true, id: "" };
      oublierPro();
      ecrire("officine", S.officine);
      toast("Vous l'indiquerez avec votre déclaration");
      aller(S.offRetour || "marques");
    });

    // Inscription : les champs gardent leur valeur sans redessiner l'ecran
    // a chaque lettre, sinon le clavier se referme sur iPhone.
    [["pro-numero", "proNumero"], ["pro-email", "proEmail"], ["pro-code", "proCode"]].forEach(function (c) {
      var e = $(c[0]);
      if (e) e.addEventListener("input", function () { S[c[1]] = e.value; });
    });
    var pd = $("pro-demander");
    if (pd) pd.addEventListener("click", demanderCode);
    var pv = $("pro-valider");
    if (pv) pv.addEventListener("click", envoyerCode);
    var ce = $("pro-email");
    if (ce) ce.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ce.blur(); demanderCode(); } });
    var cc = $("pro-code");
    if (cc) cc.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { cc.blur(); envoyerCode(); } });

    var cd = $("copier-decl");
    if (cd) cd.addEventListener("click", function () {
      var txt = recapitulatif();
      var ok = function () { toast("Déclaration copiée"); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok, function () { copierSecours(txt) ? ok() : toast("Copie impossible sur ce téléphone"); });
      } else {
        copierSecours(txt) ? ok() : toast("Copie impossible sur ce téléphone");
      }
    });

    var f = $("filtre");
    if (f) f.addEventListener("input", function () {
      S.filtre = f.value;
      var pos = f.selectionStart;
      rendre();
      var nf = $("filtre");
      if (nf) { nf.focus(); try { nf.setSelectionRange(pos, pos); } catch (e) {} }
    });
  }

  function copierSecours(txt) {
    try {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  /* ================================================================== */
  /* Demarrage                                                            */
  /* ================================================================== */

  S.vue = S.role ? (S.role === "pro" ? "proAccueil" : "accueil") : "role";

  var splash = $("splash");
  function fermerSplash() { if (splash) { splash.style.display = "none"; splash = null; } }
  splash.addEventListener("click", fermerSplash);
  setTimeout(fermerSplash, 1400);

  // Le fichier des pharmacies se telecharge en arriere-plan des l'ouverture,
  // pour etre pret quand le parent lance sa premiere recherche.
  chargerPdv().catch(function () { /* on reessaiera a la recherche */ });

  window.BIBE_TEST = {
    etat: S,
    familles: FAMILLES,
    equiv: EQUIV,
    chercherAutour: function (a, b, c) { return chercherAutour(a, b, c); },
    localiserTexte: function (t) { return localiserTexte(t); },
    candidatsDuLieu: function (t) { return candidatsDuLieu(t); },
    cheminAutorisation: cheminAutorisation,
    // Le banc joue le serveur : il l'annonce ici, puis intercepte les appels.
    // La version deposee, elle, part avec SERVEUR vide tant qu'il n'existe
    // pas, ce que verifie la serie des textes.
    brancherServeur: function (url) { SERVEUR = url || ""; },
    serveurPret: serveurPret,
    chargerPdv: chargerPdv,
    distanceKm: distanceKm,
    formaterDist: formaterDist,
    telLien: telLien,
    // Rejoue un premier lancement : sans cela, le cache du navigateur sert
    // les donnees et le chemin d'echec n'est jamais parcouru par les tests.
    oublierDonnees: function () { PDV = null; chargementPdv = null; INDEX_LIEUX = null; }
  };

  rendre();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
