<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIBE</title>
<meta name="description" content="Trouvez les pharmacies et parapharmacies autour de vous pour le lait de votre bébé.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F5F1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIBE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta name="bibe-version" content="0.4.1">
</head>
<body>
<style>
  :root {
    --paper: #F2F5F1; --card: #FFFFFF; --sunk: #E9EEE8;
    --ink: #14201B; --soft: #52625A; --faint: #7A8A80;
    --rule: #DCE4DD; --firm: #C2CEC5;
    --accent: #0B7A52; --accent-pale: #E0EFE7; --sur-accent: #FFFFFF;
    --corail: #B8421F; --corail-wash: #F8E7E2;
    --badge: #E9EEE8; --badge-sel: #C8E3D5;
    --amber: #8A5306; --amber-wash: #F6EAD8;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0C1310; --card: #151E19; --sunk: #101915;
      --ink: #E3ECE6; --soft: #A3B4AA; --faint: #7D8E84;
      --rule: #25312B; --firm: #37463E;
      --accent: #34C48A; --accent-pale: #14301F; --sur-accent: #062416;
      --corail: #F08A6E; --corail-wash: #351B15;
      --badge: #1F2B25; --badge-sel: #1F4231;
      --amber: #E3A95E; --amber-wash: #302516;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0C1310; --card: #151E19; --sunk: #101915;
    --ink: #E3ECE6; --soft: #A3B4AA; --faint: #7D8E84;
    --rule: #25312B; --firm: #37463E;
    --accent: #34C48A; --accent-pale: #14301F; --sur-accent: #062416;
    --corail: #F08A6E; --corail-wash: #351B15;
    --badge: #1F2B25; --badge-sel: #1F4231;
    --amber: #E3A95E; --amber-wash: #302516;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  /* Deux ambiances, selon qui ouvre l'application.

     Le vert reste celui de l'officine : c'est la couleur du metier, et
     un pharmacien doit se sentir chez lui. Un parent, lui, ouvre BIBE la
     nuit, souvent inquiet : on lui donne un bleu-violet plus doux, qui
     ne crie pas et qui se distingue du vert au premier coup d'oeil.

     Le corail (absent, fermé) et l'ambre (avertissement) ne bougent
     pas : ce sont des sens, pas une ambiance. */
  :root[data-profil="parent"] {
    --accent: #55519C; --accent-pale: #E8E6F5; --sur-accent: #FFFFFF;
    --badge-sel: #D6D2EE;
    /* Les neutres suivent, sinon le vert reste partout : le papier, les
       cartes et le texte de BIBE sont tous teintes de vert. Meme clarte,
       autre teinte, pour que rien ne change de lisibilite. */
    --paper: #F3F2F7; --sunk: #ECEAF3; --badge: #ECEAF3;
    --ink: #1A1826; --soft: #585470; --faint: #817D96;
    --rule: #DEDBE8; --firm: #C5C1D6;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-profil="parent"]:not([data-theme="light"]) {
      --accent: #A9A2F0; --accent-pale: #201D3A; --sur-accent: #0D0A22;
      --badge-sel: #2A2550;
      --paper: #0F0D16; --card: #1A1726; --sunk: #14111F; --badge: #241F38;
      --ink: #E7E4F0; --soft: #ABA5C0; --faint: #857FA0;
      --rule: #2A2640; --firm: #3E3958;
    }
  }
  :root[data-profil="parent"][data-theme="dark"] {
    --accent: #A9A2F0; --accent-pale: #201D3A; --sur-accent: #0D0A22;
    --badge-sel: #2A2550;
    --paper: #0F0D16; --card: #1A1726; --sunk: #14111F; --badge: #241F38;
    --ink: #E7E4F0; --soft: #ABA5C0; --faint: #857FA0;
    --rule: #2A2640; --firm: #3E3958;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* L'application occupe tout l'ecran. Les zones sures (encoche, ilot,
     barre de geste, coins arrondis, paysage) sont reservees par des
     marges calculees, jamais par des valeurs fixes. */
  .app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--paper);
  }
  /* La marge basse tient compte de la barre de geste MEME sans barre de
     navigation : sur la liste des resultats, la derniere pharmacie passait
     sous le trait de l'iPhone (mesure : 779 px contre 778 px). */
  .ecran {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 calc(16px + var(--sar)) calc(24px + var(--sab)) calc(16px + var(--sal));
  }
  .ecran.avec-bas { padding-bottom: calc(96px + var(--sab)); }

  /* ---------- Ouverture ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 50; background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: var(--sat) var(--sar) var(--sab) var(--sal);
  }
  .splash-logo { font-size: 46px; font-weight: 800; letter-spacing: 4px; color: var(--accent); }
  .splash-bl { font-size: 15px; color: var(--soft); }

  /* ---------- Barre haute ---------- */
  .haut {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    padding: calc(12px + var(--sat)) 0 10px; display: flex; align-items: center; gap: 10px;
    min-height: 44px;
  }
  .logo { font-size: 19px; font-weight: 800; letter-spacing: 1.4px; color: var(--accent); }
  /* L'etiquette reste discrete a l'oeil, mais sa zone de toucher atteint
     44 px de haut grace au pseudo-element, qui deborde sans se voir. */
  .role-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); border: 1px solid var(--rule); padding: 5px 9px; border-radius: 6px;
    background: none; min-height: 32px; position: relative; white-space: nowrap;
  }
  .role-tag::after { content: ""; position: absolute; top: -7px; bottom: -7px; left: -3px; right: -3px; }
  .retour {
    background: none; border: none; padding: 8px 8px 8px 0; color: var(--soft);
    font-size: 16px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; text-align: left;
  }
  .haut-fin { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  /* 44 px : le minimum d'une cible tactile. A 40 px, le bouton manquait
     sous le pouce. */
  .rond {
    background: var(--card); border: 1px solid var(--firm); border-radius: 999px;
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--soft);
  }

  h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 6px; line-height: 1.2; }
  h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .chapo { color: var(--soft); margin: 0 0 18px; font-size: 15px; }

  /* ---------- Blocs communs ---------- */
  .carte-choix {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 16px;
    padding: 18px; text-align: left; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .carte-choix .t { font-size: 18px; font-weight: 700; }
  .carte-choix .d { font-size: 14px; color: var(--soft); line-height: 1.45; }

  .cta {
    width: 100%; background: var(--corail); color: #fff; border: none; border-radius: 14px;
    padding: 16px; font-size: 17px; font-weight: 700; margin-top: 12px; min-height: 54px;
  }
  .cta.vert { background: var(--accent); color: var(--sur-accent); }
  .cta:disabled { opacity: 0.45; cursor: not-allowed; }
  .cta-2 {
    width: 100%; background: none; color: var(--soft); border: 1px solid var(--firm);
    border-radius: 14px; padding: 14px; font-size: 15px; margin-top: 10px; min-height: 50px;
  }
  .aide {
    margin-top: 18px; padding: 14px 16px; background: var(--sunk); border-radius: 12px;
    font-size: 14px; color: var(--soft); line-height: 1.5;
  }
  .aide b { color: var(--ink); }
  .alerte {
    margin: 0 0 14px; padding: 12px 14px; background: var(--amber-wash); border-radius: 12px;
    font-size: 14px; color: var(--ink); line-height: 1.45; border-left: 3px solid var(--amber);
  }

  .champ {
    width: 100%; background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 15px; font-size: 16px; margin-bottom: 8px;
  }
  .champ::placeholder { color: var(--faint); }

  /* ---------- Visuels des marques ---------- */
  /* Plaque blanche dans les deux themes : les logos et les boites sont
     dessines pour un fond clair. */
  .plaque {
    display: flex; align-items: center; justify-content: center; height: 58px;
    background: #FFFFFF; border-radius: 8px; padding: 7px 10px; margin-bottom: 5px;
  }
  .plaque img { display: block; max-width: 100%; max-height: 44px; object-fit: contain; }
  .vignette { flex: none; width: 56px; height: 56px; border-radius: 8px; background: #FFFFFF; object-fit: contain; }
  .vignette.vide { background: var(--sunk); }
  img.rate { visibility: hidden; }
  .plaque:has(img.rate) { display: none; }
  .ligne.avec-vignette { padding-top: 8px; padding-bottom: 8px; }
  .equiv.avec-vignette { display: flex; align-items: center; gap: 12px; }

  /* ---------- Confirmation en grand ---------- */
  /* Un parent reveille la nuit ne reconnait pas une marque sur une vignette
     de 48 px. Avant d'aller plus loin, on la lui montre en grand. */
  .grand-visuel {
    display: flex; align-items: center; justify-content: center;
    background: #FFFFFF; border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .grand-visuel img { display: block; max-width: 100%; object-fit: contain; }
  .grand-visuel.logo { min-height: 150px; }
  .grand-visuel.logo img { max-height: 120px; }
  .grand-visuel.sans-logo { background: var(--sunk); }
  .nom-en-grand { font-size: 34px; font-weight: 800; color: var(--ink); text-align: center;
                  line-height: 1.15; padding: 14px 4px; }
  /* Sur un iPhone SE, la boite a 192 px poussait « C'est ce lait » sous la
     barre de geste : le parent voyait la photo sans pouvoir valider. Mesure
     faite au banc : tout sauf la photo occupe 406 px, et la zone sure
     s'arrete 34 px avant le bas. La photo prend donc ce qui reste, moins
     20 px de marge. Au-dela de 660 px de haut, rien ne change. */
  .grand-visuel.boite img { max-height: min(280px, calc(100vh - 460px)); }
  .grand-vide { color: #52625A; font-size: 15px; text-align: center; }

  /* ---------- Lait choisi ---------- */
  .bandeau-lait { background: var(--accent-pale); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .bandeau-lait .vignette { width: 64px; height: 64px; }
  .bandeau-lait .m { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
  .bandeau-lait .p { font-weight: 700; font-size: 17px; }
  .bandeau-lait .s { font-size: 13px; color: var(--soft); }

  /* ---------- Les laits enregistres, un par enfant ----------
     Grandes cartes en haut de l'accueil : c'est le premier geste d'un
     parent qui rouvre BIBE, et il le fait souvent d'une main. */
  .enfants { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .enfant {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 76px;
    padding: 10px 14px 10px 10px; border-radius: 14px; border: 1px solid var(--trait);
    background: var(--card); color: var(--ink); text-align: left; font: inherit; cursor: pointer;
  }
  .enfant:active { background: var(--accent-pale); }
  .enfant .vignette { width: 56px; height: 56px; }
  .enfant .vignette img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
  .enfant .qui { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .enfant .prenom { font-weight: 700; font-size: 17px; }
  .enfant .quoi { font-size: 14px; color: var(--soft); overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .enfant .fleche { color: var(--soft); font-size: 22px; flex: none; }
  .enfant .aussi { color: var(--accent); font-weight: 700; }

  /* Les autres laits du meme enfant, sur l'ecran des resultats. */
  .aussi-laits { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .aussi-laits .k { font-size: 13px; color: var(--soft); width: 100%; }
  .puce {
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; min-height: 44px;
    border-radius: 999px; border: 1px solid var(--trait); background: var(--card);
    color: var(--ink); cursor: pointer;
  }
  .puce.ici { background: var(--accent); border-color: var(--accent); color: var(--sur-accent); }

  /* Glisser vers la gauche decouvre Supprimer.

     C'est le bouton qui entre par la droite, et non la carte qui part
     vers la gauche : en la faisant glisser, la photo et le prenom
     sortaient de l'ecran, et le parent ne voyait plus QUEL enfant il
     s'appretait a supprimer. La carte ne bouge donc pas. */
  .rangee { position: relative; border-radius: 14px; overflow: hidden; }
  .rangee .enfant { position: relative; z-index: 0; }
  .rangee .supprimer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 112px; z-index: 1;
    border: 0; border-radius: 0; background: var(--corail); color: #FFFFFF;
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
    transform: translateX(112px); will-change: transform;
  }
  .rangee[data-ouvert="0"] .supprimer { pointer-events: none; }
  .rangee[data-ouvert="1"] .enfant .fleche { visibility: hidden; }

  /* ---------- Catalogue ---------- */
  /* Un bandeau plein par famille : avec 36 marques et leurs logos, le petit
     intertitre gris se perdait entre les cartes. La couleur reprend celle
     des boites de chaque famille (bleu, vert, violet pour la chevre, ambre
     pour les preparations medicales). */
  /* La couleur porte toute la section, pas seulement son titre : un simple
     bandeau se perdait entre les cartes, surtout sur fond sombre. */
  .famille-bloc {
    background: var(--fam-fond); border-radius: 16px; border-left: 5px solid var(--fam-trait);
    margin: 22px -6px 0; padding: 2px 10px 12px;
  }
  .famille-bloc:first-of-type { margin-top: 14px; }
  .famille {
    display: flex; align-items: baseline; gap: 10px;
    margin: 12px 4px 10px; color: var(--fam-texte);
    font-size: 16px; font-weight: 700; line-height: 1.3;
  }
  /* Le titre occupe la place restante et se coupe en deux lignes si besoin ;
     le compte reste en face de lui, jamais renvoye seul en dessous. */
  .famille .titre-fam { flex: 1; min-width: 0; }
  .famille .nb-marques { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 400; white-space: nowrap; }
  [data-fam="courantes"] { --fam-fond: #DDE9F5; --fam-trait: #2C5F94; --fam-texte: #17395C; }
  [data-fam="bio"]       { --fam-fond: #DDEDDB; --fam-trait: #3F7D34; --fam-texte: #22491D; }
  [data-fam="chevre"]    { --fam-fond: #E9E0F1; --fam-trait: #6B4E96; --fam-texte: #3E2C59; }
  [data-fam="medicales"] { --fam-fond: #F7E6CE; --fam-trait: #8A5306; --fam-texte: #573503; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) [data-fam="courantes"] { --fam-fond: #16283A; --fam-trait: #6BA7DC; --fam-texte: #CBE0F2; }
    :root:not([data-theme="light"]) [data-fam="bio"]       { --fam-fond: #182E1C; --fam-trait: #72C161; --fam-texte: #CDE9C5; }
    :root:not([data-theme="light"]) [data-fam="chevre"]    { --fam-fond: #281F36; --fam-trait: #B294DA; --fam-texte: #E2D7F0; }
    :root:not([data-theme="light"]) [data-fam="medicales"] { --fam-fond: #362918; --fam-trait: #EBB268; --fam-texte: #F2DFBF; }
  }
  :root[data-theme="dark"] [data-fam="courantes"] { --fam-fond: #16283A; --fam-trait: #6BA7DC; --fam-texte: #CBE0F2; }
  :root[data-theme="dark"] [data-fam="bio"]       { --fam-fond: #182E1C; --fam-trait: #72C161; --fam-texte: #CDE9C5; }
  :root[data-theme="dark"] [data-fam="chevre"]    { --fam-fond: #281F36; --fam-trait: #B294DA; --fam-texte: #E2D7F0; }
  :root[data-theme="dark"] [data-fam="medicales"] { --fam-fond: #362918; --fam-trait: #EBB268; --fam-texte: #F2DFBF; }
  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .marque-carte {
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 13px 12px;
    text-align: left; font-weight: 700; font-size: 15px; min-height: 64px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .marque-carte .nb { font-size: 12px; font-weight: 400; color: var(--faint); font-family: var(--mono); }
  .marque-carte[data-etat="fait"] { border-color: var(--accent); background: var(--accent-pale); }
  .marque-carte[data-etat="fait"] .nb { color: var(--accent); font-weight: 600; }
  .marque-carte[data-etat="absente"] { background: var(--sunk); border-style: dashed; opacity: 0.75; }
  .marque-carte[data-etat="absente"] .nb { color: var(--amber); }

  .groupe { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin: 18px 0 7px; }

  /* ---------- Tranches d'age ---------- */
  /* Repliees par defaut : une marque comme Guigoz aligne 27 laits, et le
     parent n'en cherche qu'un, dans sa tranche. Les couleurs sont les memes
     d'une marque a l'autre, pour qu'il retrouve la sienne d'un coup d'oeil. */
  .age-tete {
    width: 100%; display: flex; align-items: center; gap: 10px; min-height: 54px;
    margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; text-align: left;
    border: 1px solid var(--age-trait); border-left: 5px solid var(--age-trait);
    background: var(--age-fond); color: var(--age-texte); font-size: 16px; font-weight: 700;
  }
  .age-tete .nb-laits { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 400; white-space: nowrap; }
  .age-tete .chev { font-size: 15px; transition: transform 0.15s; }
  .age-tete[aria-expanded="true"] { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .age-tete[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .age-corps {
    border: 1px solid var(--age-trait); border-top: none; border-left: 5px solid var(--age-trait);
    border-radius: 0 0 12px 12px; padding: 10px 10px 4px; margin-bottom: 4px;
  }
  @media (prefers-reduced-motion: reduce) { .age-tete .chev { transition: none; } }

  [data-age="0-6 mois"]     { --age-fond: #E2EDF7; --age-trait: #3C7CB8; --age-texte: #17395C; }
  [data-age="6-12 mois"]    { --age-fond: #E0EFE7; --age-trait: #0B7A52; --age-texte: #0C4630; }
  [data-age="12 mois et +"] { --age-fond: #F7E9D6; --age-trait: #B57518; --age-texte: #5A3A05; }
  [data-age="0-12 mois"]    { --age-fond: #EEE5F2; --age-trait: #7A5A9E; --age-texte: #42305A; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) [data-age="0-6 mois"]     { --age-fond: #16283A; --age-trait: #6BA7DC; --age-texte: #CBE0F2; }
    :root:not([data-theme="light"]) [data-age="6-12 mois"]    { --age-fond: #102C1E; --age-trait: #34C48A; --age-texte: #BDE7D2; }
    :root:not([data-theme="light"]) [data-age="12 mois et +"] { --age-fond: #362918; --age-trait: #EBB268; --age-texte: #F2DFBF; }

  function telLien(tel) { return "tel:" + String(tel).replace(/[^\d+]/g, ""); }

  /* Visuels : decoratifs (alt vide), le nom est toujours ecrit a cote.
     Une image absente du telephone hors connexion disparait sans casser
     la mise en page. */
  function vignette(p) {
    return p && p[3]
      ? '<img class="vignette" src="' + ech(p[3]) + '" alt="" loading="lazy" decoding="async" width="56" height="56">'
      : '<span class="vignette vide"></span>';
  }
  function bandeauLait(l) {
    var p = PRODUITS[cleLait(l)];
    return '<div class="bandeau-lait">' + (p && p[3] ? vignette(p) : "") + '<div><div class="m">' + ech(l.marque) +
      '</div><div class="p">' + ech(l.produit) + "</div>" + (l.spec ? '<div class="s">' + ech(l.spec) + "</div>" : "") + "</div></div>";
  }
  document.addEventListener("error", function (ev) {
    var t = ev.target;
    if (t && t.tagName === "IMG") t.classList.add("rate");
  }, true);

  function ceLieu(p) { return p[7] === 1 ? "cette parapharmacie" : "cette pharmacie"; }

  /* ================================================================== */
  /* Horaires                                                             */
  /* ================================================================== */

  /* Les horaires arrivent compactes : sept journees separees par « | »,
     creneaux en minutes depuis minuit, « * » pour une journee identique a
     la veille. Un parent veut deux choses : est-ce ouvert maintenant, et
     jusqu'a quand. */
  var JOURS_NOM = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];

  function deplierHoraires(compact) {
    if (!compact) return null;
    var jours = [], precedent = [];
    compact.split("|").forEach(function (part) {
      if (part === "*") { jours.push(precedent); return; }
      var creneaux = part ? part.split(",").map(function (c) {
        var b = c.split("-");
        return [parseInt(b[0], 10), parseInt(b[1], 10)];
      }) : [];
      jours.push(creneaux);
      precedent = creneaux;
    });
    return jours.length === 7 ? jours : null;
  }

  function heureCourte(m) {
    m = m % 1440;
    var h = Math.floor(m / 60), mn = m % 60;
    return h + " h" + (mn ? " " + (mn < 10 ? "0" : "") + mn : "");
  }

  function creneauxEnClair(creneaux) {
    if (!creneaux || !creneaux.length) return "Fermé";
    return creneaux.map(function (c) { return heureCourte(c[0]) + " à " + heureCourte(c[1]); }).join(", ");
  }

  /* Ce que dit la fiche a la ligne « Aujourd'hui ».

     La deuxieme ligne donne les creneaux de la journee. Quand l'officine
     est fermee toute la journee, elle repetait « Fermé » juste sous
     « Fermé » : on l'omet. */
  function ligneAujourdhui(et) {
    // Le message commence par « Ouvert jusqu'a... » : derriere le mot en
    // gras, cela donnait « Ouvert, ouvert jusqu'a 19 h ».
    var suite = (et.message || "").replace(/^Ouvert /, "").toLowerCase();
    return "<b>" + (et.ouvert ? "Ouvert" : "Fermé") + "</b>" +
      (suite ? ", " + ech(suite) : "") +
      (et.jour && et.jour.length ? "<br>" + ech(creneauxEnClair(et.jour)) : "");
  }

  // Lundi vaut 0 dans nos donnees, dimanche vaut 0 pour le navigateur.
  function indexJour(d) { return (d.getDay() + 6) % 7; }

  /* Rend { ouvert, ferme, message } ou null. Le creneau de la veille qui
     deborde apres minuit compte encore : une pharmacie ouverte jusqu'a 2 h
     du matin est ouverte a 1 h. */
  function etatHoraire(compact, maintenant) {
    var jours = deplierHoraires(compact);
    if (!jours) return null;
    var d = maintenant || new Date();
    var i = indexJour(d), m = d.getHours() * 60 + d.getMinutes();
    var ouvert = null;
    jours[i].forEach(function (c) { if (m >= c[0] && m < c[1]) ouvert = c; });
    jours[(i + 6) % 7].forEach(function (c) { if (c[1] > 1440 && m < c[1] - 1440) ouvert = [c[0] - 1440, c[1] - 1440]; });
    if (ouvert) return { ouvert: true, message: "Ouvert jusqu'à " + heureCourte(ouvert[1]), jour: jours[i] };
    var suivant = null;
    jours[i].forEach(function (c) { if (c[0] > m && suivant === null) suivant = c[0]; });
    if (suivant !== null) return { ouvert: false, message: "Ouvre à " + heureCourte(suivant), jour: jours[i] };
    for (var k = 1; k <= 7; k++) {
      var j = jours[(i + k) % 7];
      if (j.length) {
        return { ouvert: false, jour: jours[i],
                 message: "Ouvre " + (k === 1 ? "demain" : JOURS_NOM[(i + k) % 7]) + " à " + heureCourte(j[0][0]) };
      }
    }
    return { ouvert: false, message: "", jour: jours[i] };
  }

  function horairesSemaine(compact) {
    var jours = deplierHoraires(compact);
    if (!jours) return "";
    var lignes = [], i = 0;
    while (i < 7) {
      var j = i + 1;
      while (j < 7 && String(jours[j]) === String(jours[i])) j++;
      lignes.push((j === i + 1 ? JOURS_NOM[i] : JOURS_NOM[i] + " au " + JOURS_NOM[j - 1]) +
        " : " + creneauxEnClair(jours[i]));
      i = j;
    }
    return lignes.join("<br>");
  }

  /* ================================================================== */
  /* Geolocalisation                                                      */
  /* ================================================================== */

  var SANS_GEOLOC = "La localisation n'est pas disponible ici. Indiquez une ville ou un code postal.";
  var ECHEC_LISTE = "La liste des points de vente n'a pas pu être chargée. Vérifiez votre connexion et réessayez.";

  // La position du telephone et la liste des points de vente, ensemble.
  function positionEtListe() {
    return Promise.all([
      chargerPdv(),
      new Promise(function (ok, ko) {
        // Le refus est marque comme venant de la localisation : il peut
        // arriver pendant que la liste se charge encore, et ne doit pas etre
        // pris pour une panne de chargement.
        navigator.geolocation.getCurrentPosition(ok, function (e) { ko({ geo: true, code: e && e.code }); }, {
          enableHighAccuracy: false, timeout: 15000, maximumAge: 300000
        });
      })
    ]).then(function (v) { return v[1].coords; });
  }

  /* Une page web ne peut pas ouvrir les reglages de l'appareil : une fois la
     localisation refusee, le navigateur ne la redemande plus. Tout ce que
     BIBE peut faire, c'est dire ou aller, et l'endroit n'est pas le meme
     partout. Sans cela, le message envoyait chercher un bouton qui n'existe
     nulle part. */
  function cheminAutorisation() {
    var ua = navigator.userAgent || "";
    var iOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (iOS) return "sur iPhone : Réglages, Confidentialité et sécurité, Service de localisation, Sites web Safari.";
    if (/Android/.test(ua)) return "touchez l'icône à gauche de l'adresse du site, puis Autorisations, puis Position.";
    return "cliquez sur l'icône à gauche de l'adresse du site, autorisez la position, puis rechargez la page.";
  }

  function echecPosition(err) {
    if (!err || !err.geo) return { etat: "donnees", message: ECHEC_LISTE };
    if (err.code === 1) return { etat: "refus", message: "Vous n'avez pas autorisé la localisation. Indiquez une ville ou un code postal, ou autorisez BIBE : " + cheminAutorisation() };
    if (err.code === 3) return { etat: "delai", message: "La localisation prend trop de temps. Réessayez, ou indiquez une ville ou un code postal." };
    return { etat: "indispo", message: "Votre position n'a pas pu être déterminée. Indiquez une ville ou un code postal." };
  }

  function localiser() {
    S.locEtat = "encours";
    S.locMessage = "";
    rendre();

    if (!("geolocation" in navigator)) {
      S.locEtat = "indispo";
      S.locMessage = SANS_GEOLOC;
      rendre();
      return;
    }

    positionEtListe().then(function (c) {
      S.position = { lat: c.latitude, lon: c.longitude };
      S.sourcePosition = { type: "gps", precision: Math.round(c.accuracy || 0) };
      lancerRecherche();
    }).catch(function (err) {
      var e = echecPosition(err);
      S.locEtat = e.etat;
      S.locMessage = e.message;
      rendre();
    });
  }

  function localiserManuel(texte) {
    chargerPdv().then(function () {
      var r = localiserTexte(texte);
      if (!r) {
        S.locEtat = "introuvable";
        S.locMessage = "BIBE ne reconnaît pas « " + texte + " ». Essayez un code postal à cinq chiffres ou le nom exact de la ville.";
        rendre();
        return;
      }
      S.position = r.pos;
      S.sourcePosition = { type: "manuel", libelle: r.libelle, approx: !!r.approx };
      lancerRecherche();
    }).catch(function () {
      S.locEtat = "donnees";
      S.locMessage = ECHEC_LISTE;
      rendre();
    });
  }

  function lancerRecherche() {
    var r = chercherAutour(S.position.lat, S.position.lon, S.rayon);
    S.resultats = r.resultats;
    S.rayonEffectif = r.rayon;
    S.total = r.total;
    S.locEtat = null;
    aller("resultats");
  }

  /* ================================================================== */
  /* Identification du point de vente qui declare                         */
  /* ================================================================== */

  var MAX_CANDIDATS_AUTOUR = 12;
  var MAX_LISTE_VILLE = 80;

  function trierParNom(liste) {
    return liste.slice().sort(function (a, b) { return aplatir(a[0]).localeCompare(aplatir(b[0]), "fr"); })
      .map(function (p) { return { p: p, d: null }; });
  }

  /* Par code postal ou par ville : tous les points de vente du lieu, par
     ordre alphabetique. Au comptoir, on cherche son nom, pas une distance
     a un centre-ville calcule. */
  function candidatsDuLieu(texte) {
    var t = aplatir(texte), idx = indexLieux();
    if (/^\d{5}$/.test(t)) {
      if (!idx.cp[t]) return { erreur: "BIBE ne connaît aucun point de vente au " + t + ". Vérifiez le code postal, ou essayez le nom de votre ville." };
      return { liste: trierParNom(idx.cp[t]), libelle: "au " + t };
    }
    var v = t ? cleVille(t) : null;
    if (!v) return { erreur: "BIBE ne reconnaît pas « " + texte + " ». Essayez votre code postal à cinq chiffres." };
    var l = idx.ville[v];
    if (l.length > MAX_LISTE_VILLE) {
      return { erreur: l[0][3] + " compte " + l.length + " points de vente : indiquez plutôt votre code postal." };
    }
    return { liste: trierParNom(l), libelle: "à " + l[0][3] };
  }

  function localiserOfficine() {
    S.offEtat = "encours";
    S.offMessage = "";
    rendre();
    if (!("geolocation" in navigator)) {
      S.offEtat = null;
      S.offMessage = SANS_GEOLOC;
      rendre();
      return;
    }
    positionEtListe().then(function (c) {
      S.offEtat = null;
      // Parti sur un autre ecran entre-temps : on ne l'y arrache pas.
      if (S.vue !== "proOfficine") return;
      S.offListe = chercherAutour(c.latitude, c.longitude, 1).resultats.slice(0, MAX_CANDIDATS_AUTOUR);
      S.offGps = true;
      S.offLieu = "";
      S.offFiltre = "";
      aller("proOfficineListe");
    }).catch(function (err) {
      S.offEtat = null;
      S.offMessage = echecPosition(err).message;
      if (S.vue === "proOfficine") rendre();
    });
  }

  function chercherOfficine(texte) {
    chargerPdv().then(function () {
      var r = candidatsDuLieu(texte);
      if (r.erreur) { S.offMessage = r.erreur; rendre(); return; }
      S.offMessage = "";
      S.offListe = r.liste;
      S.offGps = false;
      S.offLieu = r.libelle;
      S.offFiltre = "";
      aller("proOfficineListe");
    }).catch(function () {
      S.offMessage = ECHEC_LISTE;
      rendre();
    });
  }

  function adresseOfficine(o) {
    return [o.adresse, [o.cp, o.ville].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  }

  /* ================================================================== */
  /* Inscription du point de vente                                        */
  /* ================================================================== */

  /* Le numero demande depend du registre qui permet de verifier : les
     pharmaciens sont inscrits au repertoire des professionnels de sante,
     les parapharmacies seulement au registre des entreprises. */
  function quelNumero() {
    var para = S.officine && S.officine.type === 1;
    return para
      ? { cle: "siret", titre: "Le SIRET de votre magasin", aide: "14 chiffres. Il figure sur vos factures et sur votre extrait d'immatriculation.",
          motif: /^\d{14}$/, erreur: "Un SIRET compte 14 chiffres.", mode: "numeric" }
      : { cle: "rpps", titre: "Votre numéro RPPS", aide: "11 chiffres. C'est votre numéro de professionnel de santé, celui qui figure sur vos ordonnances.",
          motif: /^\d{11}$/, erreur: "Un numéro RPPS compte 11 chiffres.", mode: "numeric" };
  }

  // Une adresse doit ressembler a une adresse : ni plus, ni moins. Le seul
  // vrai controle, c'est que le code y arrive.
  function emailPlausible(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v || "").trim()); }

  function etatPro() {
    var p = S.pro, o = S.officine;
    if (!p || !o || p.pdv !== o.id) return "aucun";
    return p.etat || "aucun";
  }

  function oublierPro() { S.pro = null; effacer("pro"); }

  function demanderCode() {
    var n = quelNumero(), num = S.proNumero.replace(/[\s.-]/g, ""), mail = S.proEmail.trim();
    if (!n.motif.test(num)) { S.proMessage = n.erreur; rendre(); return; }
    if (!emailPlausible(mail)) { S.proMessage = "Cette adresse ne ressemble pas à une adresse électronique."; rendre(); return; }
    S.proMessage = "";
    S.proEnvoi = "encours";
    rendre();
    appelServeur("/inscription", {
      pdv: S.officine.id, type: S.officine.type, cle: n.cle, numero: num, email: mail
    }).then(function () {
      S.pro = { pdv: S.officine.id, etat: "demande", email: mail };
      ecrire("pro", S.pro);
      S.proEnvoi = null;
      S.proNumero = "";
      aller("proAttente");
    }).catch(function (e) {
      S.proEnvoi = null;
      S.proMessage = e && e.horsService
        ? "Les inscriptions ne sont pas encore ouvertes. Elles le seront au lancement."
        : "La demande n'est pas partie. Vérifiez votre connexion et réessayez.";
      rendre();
    });
  }

  function envoyerCode() {
    var code = S.proCode.replace(/[\s-]/g, "").toUpperCase();
    if (code.length < 6) { S.proMessage = "Le code compte six caractères."; rendre(); return; }
    S.proMessage = "";
    S.proEnvoi = "encours";
    rendre();
    appelServeur("/code", { pdv: S.officine.id, code: code }).then(function (d) {
      S.proEnvoi = null;
      if (!d.jeton) {
        S.proMessage = "Ce code n'est pas le bon. Vérifiez-le, ou demandez-en un nouveau.";
        rendre();
        return;
      }
      S.pro = { pdv: S.officine.id, etat: "valide", email: (S.pro || {}).email || "", jeton: d.jeton };
      ecrire("pro", S.pro);
      S.proCode = "";
      toast("Votre point de vente est vérifié");
      aller("marques");
    }).catch(function (e) {
      S.proEnvoi = null;
      S.proMessage = e && e.horsService
        ? "Les inscriptions ne sont pas encore ouvertes. Elles le seront au lancement."
        : "La vérification n'a pas abouti. Vérifiez votre connexion et réessayez.";
      rendre();
    });
  }

  /* ================================================================== */
  /* Ecrans                                                               */
  /* ================================================================== */

  function haut(titre, versArriere) {
    var etiquette = S.role
      ? '<button class="role-tag" data-role-reset="1" aria-label="Changer de profil">' +
        (S.role === "pro" ? "Point de vente" : "Parent") + " ⌄</button>"
      : "";
    var g = versArriere
      ? '<button class="retour" data-va="' + versArriere + '">‹ ' + ech(titre) + "</button>"
      : '<span class="logo">BIBE</span>' + etiquette;
    return '<div class="haut">' + g + '<span class="haut-fin">' + (versArriere ? etiquette : "") +
      '<button class="rond" id="theme" aria-label="' + (S.sombre ? "Passer en mode clair" : "Passer en mode sombre") + '">' +
      (S.sombre ? SOLEIL : LUNE) + "</button></span></div>";
  }

  var V = {};

  V.role = function () {
    return haut() + "<h1>Vous êtes…</h1>" +
      '<p class="chapo">Cette question ne vous sera posée qu\'une fois.</p>' +
      '<button class="carte-choix" data-role="parent"><span class="t">Un parent</span>' +
      '<span class="d">Trouver les pharmacies et parapharmacies autour de vous, avec leur numéro et l\'itinéraire.</span></button>' +
      '<button class="carte-choix" data-role="pro"><span class="t">Un point de vente</span>' +
      '<span class="d">Pharmacie ou parapharmacie : déclarez les laits que vous référencez.</span></button>' +
      '<div class="aide">BIBE est gratuit. Vous pourrez changer de profil à tout moment.</div>';
  };

  /* ---------------- Parent ---------------- */

  /* Les laits enregistres, en gros, en haut de l'accueil.

     C'est le geste unique demande : un parent qui ouvre BIBE la nuit
     touche la carte de son enfant et part chercher. Il ne repasse ni par
     la liste des marques, ni par les tranches d'age. */
  function cartesEnfants(suppressible) {
    if (!S.enfants.length) return "";
    return '<div class="enfants">' + S.enfants.map(function (e, i) {
      var l0 = e.laits[0] || {};
      var p = PRODUITS[l0.marque + "|" + l0.produit];
      // Plusieurs laits : on nomme le premier et on annonce les autres,
      // sans allonger la carte. Le detail est a un geste sur les
      // resultats.
      var quoi = ech(l0.marque || "") + " " + ech(l0.produit || "");
      if (e.laits.length > 1) quoi += " <span class=\"aussi\">+ " + (e.laits.length - 1) + "</span>";
      var carte = '<button class="enfant" data-enfant="' + i + '">' +
        (p && p[3] ? '<span class="vignette"><img src="' + ech(p[3]) + '" alt="" loading="lazy"></span>'
                   : '<span class="vignette"></span>') +
        '<span class="qui"><span class="prenom">' + ech(e.prenom) + "</span>" +
        '<span class="quoi">' + quoi + "</span></span>" +
        '<span class="fleche">›</span></button>';
      if (!suppressible) return carte;
      // Le bouton de suppression vit sous la carte, decouvert par le
      // glissement. Il n'est pas cache a tout le monde pour autant : il
      // reste atteignable au clavier et par les outils de lecture.
      return '<div class="rangee" data-rangee="' + i + '">' + carte +
        '<button class="supprimer" data-supprimer="' + i + '" aria-label="Supprimer ' +
        ech(e.prenom) + '">Supprimer</button></div>';
    }).join("") + "</div>";
  }

  V.accueil = function () {
    var a = S.enfants.length;
    return haut() + "<h1>Où trouver le lait de votre bébé&nbsp;?</h1>" +
      (a ? '<p class="chapo">Touchez un enfant pour chercher son lait autour de vous.</p>' + cartesEnfants(true)
         : '<p class="chapo">Choisissez le lait, BIBE cherche les pharmacies et parapharmacies autour de vous.</p>') +
      '<button class="' + (a ? "cta-2" : "cta") + '" data-va="marques">' +
      (a ? "Chercher un autre lait" : "Trouver le lait de mon bébé") + "</button>" +
      '<button class="cta-2" id="sans-lait">Voir les pharmacies autour de moi</button>' +
      '<div class="aide"><b>Ce que BIBE sait aujourd\'hui :</b> où sont les pharmacies et ' +
      "parapharmacies, leur numéro, leur adresse. <b>Ce qu'il ne sait pas encore :</b> " +
      "lesquelles proposent votre lait. Appelez avant de vous déplacer.</div>";
  };

  V.marques = function () {
    var pro = S.role === "pro";
    var h = haut("Retour", pro ? "proAccueil" : "accueil");
    h += "<h1>" + (pro ? "Vos références" : "Quel lait&nbsp;?") + "</h1>";
    if (pro) {
      var t = traitees();
      h += '<p class="chapo">Ouvrez les marques que vous travaillez, cochez vos références.</p>' +
        '<div class="avancement"><div class="jauge"><div class="jauge-remplie" style="width:' +
        (t / MARQUES.length * 100) + '%"></div></div><span class="compteur">' + t + " / " + MARQUES.length + "</span></div>";
    }
    h += '<input class="champ" id="filtre" type="search" autocomplete="off" enterkeyhint="search" ' +
      'placeholder="Marque, lait ou besoin (AR, bio, chèvre…)" value="' + ech(S.filtre) + '">';

    // Le nom complet de chaque boite compte aussi : « Blédigest » trouve
    // le lait range sous son nouveau nom. Si rien ne sort, on repasse en
    // tolerant une lettre de travers, plutot que de rendre un ecran vide.
    var q = S.filtre.trim(), vide = true, approche = false;
    var trouve = function (m) { return texteCorrespond(q, m.cherchable); };
    if (q && !MARQUES.some(trouve)) {
      approche = true;
      trouve = function (m) { return presqueCorrespond(q, m.cherchable); };
    }
    FAMILLES.forEach(function (f) {
      var ms = f.marques.filter(function (m) { return !q || trouve(m); });
      if (!ms.length) return;
      vide = false;
      h += '<section class="famille-bloc" data-fam="' + ech(f.cle) + '">' +
        '<p class="famille"><span class="titre-fam">' + ech(f.libelle) +
        '</span><span class="nb-marques">' + compte(ms.length, "marque") + "</span></p><div class=\"grille\">";
      ms.forEach(function (m) {
        var e = S.decl[m.nom], et = "", lib = m.produits.length + " réf.";
        if (pro && e.absente) { et = "absente"; lib = "non travaillée"; }
        else if (pro && e.nb > 0) { et = "fait"; lib = e.nb + " cochée" + (e.nb > 1 ? "s" : ""); }
        h += '<button class="marque-carte" data-etat="' + et + '" data-marque="' + ech(m.nom) + '">' +
          (m.logo ? '<span class="plaque"><img src="' + ech(m.logo) + '" alt="" loading="lazy" decoding="async"></span>' : "") +
          ech(m.nom) + '<span class="nb">' + lib + "</span></button>";
      });
      h += "</div></section>";
    });
    if (vide) h += blocIntrouvable(q, pro);
    else if (approche) {
      // Dire que c'est une approximation : sans cela, un parent qui tape
      // « Calsima » croirait que BIBE a trouve sa boite.
      h += '<div class="aide">Rien ne correspond exactement à « ' + ech(q) +
        ' ». Voici ce qui s\'en rapproche.</div>';
    }
    if (pro) {
      h += '<button class="cta vert" data-va="proEnvoi"' + (totalRefs() ? "" : " disabled") + ">" +

  };

  /* Confirmation de la marque : son logo en grand, avant d'ouvrir ses laits.
     Sautee quand la marque n'a pas de logo, il n'y aurait rien a montrer. */
  V.marqueConfirme = function () {
    var m = MARQUES.filter(function (x) { return x.nom === S.marqueOuverte; })[0];
    if (!m) return V.marques();
    // Sans logo, le nom tient sa place, en grand : le parent doit voir
    // ce qu'il confirme, et une marque sur trente-six ne merite pas un
    // parcours different des autres.
    return haut("Marques", "marques") +
      '<div class="grand-visuel logo' + (m.logo ? "" : " sans-logo") + '">' +
      (m.logo ? '<img src="' + ech(m.logo) + '" alt="' + ech(m.nom) + '">'
              : '<span class="nom-en-grand">' + ech(m.nom) + "</span>") + "</div>" +
      "<h1>" + ech(m.nom) + "</h1>" +
      '<p class="chapo">' + compte(m.produits.length, "lait") + " au catalogue.</p>" +
      '<button class="cta vert" data-va="produits">C\'est cette marque</button>' +
      '<button class="cta-2" data-va="marques">Non, revenir aux marques</button>';
  };

  /* Confirmation du lait : la boite en grand, pour la comparer a celle qu'on
     a dans la main ou sur une ordonnance. */
  V.laitConfirme = function () {
    var m = MARQUES.filter(function (x) { return x.nom === S.marqueOuverte; })[0];
    var p = m && PRODUITS[m.nom + "|" + S.laitPropose];
    if (!p) return V.produits();
    var pro = S.role === "pro";
    return haut(ech(m.nom), "produits") +
      (p[3] ? '<div class="grand-visuel boite"><img src="' + ech(p[3]) + '" alt="' + ech(m.nom + " " + p[0]) + '"></div>'
            : '<div class="grand-visuel boite"><span class="grand-vide">Pas de photo de cette boîte</span></div>') +
      "<h1>" + ech(p[0]) + "</h1>" +
      '<p class="chapo">' + ech(p[4] || m.nom + " " + p[0]) + "<br>" + ech(p[1]) +
      (p[2] ? " · " + ech(p[2]) : "") + "</p>" +
      '<button class="cta vert" id="lait-oui">' + (pro ? "Je référence ce lait" : "C'est ce lait") + "</button>" +
      // Enregistrer se propose ici, ou le parent vient de reconnaitre sa
      // boite, et pas avant : c'est le seul moment ou il est sur.
      (!pro && !enfantAvecCeLait(m.nom, p[0])
        ? '<button class="cta-2" data-va="enfantNom">Enregistrer pour mon enfant</button>' : "") +
      (!pro && enfantAvecCeLait(m.nom, p[0])
        ? '<div class="aide">Déjà enregistré pour ' + ech(enfantAvecCeLait(m.nom, p[0]).prenom) + ".</div>" : "") +
      '<button class="cta-2" data-va="produits">Non, revenir à la liste</button>';
  };

  function enfantAvecCeLait(marque, produit) {
    return S.enfants.filter(function (e) {
      return e.laits.some(function (l) { return l.marque === marque && l.produit === produit; });
    })[0] || null;
  }

  /* Pour qui ce lait ?

     Un enfant peut en supporter plusieurs : quand le premier n'est nulle
     part, le parent cherche l'autre. L'ecran propose donc d'abord les
     enfants deja enregistres, avant d'en creer un nouveau. */
  V.enfantNom = function () {
    var m = MARQUES.filter(function (x) { return x.nom === S.marqueOuverte; })[0];
    var p = m && PRODUITS[m.nom + "|" + S.laitPropose];
    if (!p) return V.marques();
    var h = haut(ech(m.nom), "laitConfirme") + "<h1>Pour quel enfant&nbsp;?</h1>" +
      '<p class="chapo">' + ech(m.nom) + " " + ech(p[0]) + "</p>";
    if (S.enfants.length) {
      h += '<div class="enfants">' + S.enfants.map(function (e, i) {
        return '<button class="enfant" data-ajouter="' + i + '">' +
          '<span class="qui"><span class="prenom">' + ech(e.prenom) + "</span>" +
          '<span class="quoi">' + compte(e.laits.length, "lait") + " déjà" + "</span></span>" +
          '<span class="fleche">+</span></button>';
      }).join("") + "</div>";
      h += '<div class="aide">Un enfant peut supporter plusieurs laits : si le premier ' +
        "est introuvable, BIBE cherchera l'autre.</div>";
    }
    return h +
      '<p class="famille"><span class="titre-fam">' +
      (S.enfants.length ? "Ou un autre enfant" : "Le prénom de votre bébé") + "</span></p>" +
      '<input class="champ" id="enfant-prenom" type="text" autocomplete="off" enterkeyhint="done" ' +
      'maxlength="24" placeholder="' + ech(prenomPropose()) + '" value="' + ech(S.enfantEnCours || "") + '">' +
      '<button class="cta vert" id="enfant-ok">Enregistrer</button>' +
      '<button class="cta-2" data-va="laitConfirme">Annuler</button>' +
      '<div class="aide">Ce prénom ne quitte pas votre téléphone. Il sert seulement à ' +
      "reconnaître la carte sur l'écran d'accueil.</div>";
  };

  function prenomPropose() {
    return S.enfants.length ? "Deuxième enfant" : "Mon bébé";
  }

  V.mesLaits = function () {
    if (!S.enfants.length) {
      // L'ancien texte annoncait que tout cela « demande un compte » et que
      // « les comptes arrivent ». C'etait faux : rien ici ne quitte le
      // telephone, et aucun compte n'est prevu.
      return haut() + "<h1>Mes laits</h1>" +
        '<p class="chapo">Enregistrez le lait de votre bébé, un par enfant, et retrouvez-le ' +
        "d'un geste depuis l'accueil.</p>" +
        '<button class="cta" data-va="marques">Trouver le lait de mon bébé</button>' +
        '<div class="aide">Tout reste sur ce téléphone. BIBE ne demande ni compte, ni ' +
        "adresse électronique, et n'envoie rien ailleurs.</div>";
    }
    return haut() + "<h1>Mes laits</h1>" +
      '<p class="chapo">' + compte(S.enfants.length, "enfant") + " enregistré" +
      (S.enfants.length > 1 ? "s" : "") + " sur ce téléphone.</p>" + cartesEnfants(true) +
      '<div class="aide">Glissez une carte vers la gauche pour la supprimer.</div>' +
      '<button class="cta" data-va="marques">Ajouter un lait</button>' +
      '<div class="aide">Ces laits sont gardés sur ce téléphone, sans compte et sans ' +
      "adresse. Rien n'est envoyé ailleurs.</div>";
  };

  V.produits = function () {
    var m = MARQUES.filter(function (x) { return x.nom === S.marqueOuverte; })[0];
    if (!m) return V.marques();
    var pro = S.role === "pro", e = S.decl[m.nom];
    // Une colonne de vignettes seulement si la marque a des photos.
    var avecImg = m.produits.some(function (p) { return !!p[3]; });
    var h = haut("Marques", "marques") + "<h1>" + ech(m.nom) + "</h1>" +
      '<p class="chapo">' + (pro ? "Cochez ce que vous avez habituellement en rayon." : "Choisissez la référence exacte.") + "</p>";
    // Une marque qui tient en quelques laits s'ouvre d'elle-meme : replier
    // quatre lignes ne ferait gagner qu'un geste de plus.
    var groupes = ORDRE_AGES.map(function (age) {
      return { age: age, laits: m.produits.filter(function (p) { return p[1] === age; }) };
    }).filter(function (g) { return g.laits.length; });
    var toutOuvrir = groupes.length === 1 || m.produits.length <= 4;

    groupes.forEach(function (g) {
      var ouvert = toutOuvrir || !!S.agesOuverts[g.age] || (!S.agesOuverts._touche && S.ageOuvert === g.age);
      var cochees = pro ? g.laits.filter(function (p) { return e.coches[p[0]]; }).length : 0;
      h += '<button class="age-tete" data-age="' + ech(g.age) + '" data-age-bascule="' + ech(g.age) + '"' +
        ' aria-expanded="' + (ouvert ? "true" : "false") + '">' +
        "<span>" + g.age + '</span><span class="nb-laits">' +
        (cochees ? cochees + " sur " + g.laits.length : compte(g.laits.length, "lait")) +
        '</span><span class="chev" aria-hidden="true">⌄</span></button>';
      if (!ouvert) return;
      h += '<div class="age-corps" data-age="' + ech(g.age) + '">';
      g.laits.forEach(function (p) {
        h += '<button class="ligne' + (avecImg ? " avec-vignette" : "") + '" data-produit="' + ech(p[0]) + '" data-spec="' + ech(p[2] || "") + '"' +
          (pro ? ' aria-pressed="' + (e.coches[p[0]] ? "true" : "false") + '"' : "") + ">" +
          (pro ? '<span class="case">✓</span>' : "") + (avecImg ? vignette(p) : "") +
          '<span class="noms"><span class="nom">' + ech(p[0]) + "</span>" +
          (p[4] ? '<span class="complet">' + ech(p[4]) + "</span>" : "") +
          (p[2] ? '<span class="spec">' + ech(p[2]) + "</span>" : "") + "</span></button>";
      });
      h += "</div>";
    });
    if (pro) {
      h += '<button class="cta vert" data-va="marques">C\'est bon pour cette marque</button>' +
        '<button class="cta-2" id="absente">' +
        (e.absente ? "Finalement, je travaille cette marque" : "Je ne travaille pas cette marque") + "</button>" +
        // Une reference qu'il vend et qu'il ne peut pas cocher resterait
        // invisible, et un parent lirait « non déclaré » dans une officine
        // qui la propose.

  V.localisation = function () {
    var h = haut("Retour", S.lait ? "produits" : "accueil");

    if (S.locEtat === "encours") {
      return h + '<div class="etat-loc"><div class="roue" aria-hidden="true"></div>' +
        "<h2>Recherche de votre position</h2>" +
        '<p class="chapo">Autorisez la localisation si votre téléphone vous le demande.</p></div>';
    }
    h += "<h1>Où cherchez-vous&nbsp;?</h1>";
    if (S.locMessage) h += '<div class="alerte">' + ech(S.locMessage) + "</div>";
    h += '<button class="cta" id="me-localiser">Autour de moi</button>' +
      '<p class="groupe" style="margin-top:24px">Ou autour d\'un lieu</p>' +

  /* Les autres laits du meme enfant, a portee de doigt.

  function enfantDuLait(l) {
    if (!l) return null;
    return S.enfants.filter(function (e) {
      return e.laits.some(function (x) { return x.marque === l.marque && x.produit === l.produit; });
    })[0] || null;
  }

  function autresLaits(l) {
    var e = enfantDuLait(l);
    if (!e || e.laits.length < 2) return "";
    return '<div class="aussi-laits"><span class="k">Aussi pour ' + ech(e.prenom) + "</span>" +
      e.laits.map(function (x, i) {

      }).join("") + "</div>";
  }

  V.resultats = function () {
    var l = S.lait;
    var h = haut("Retour", "accueil");
    if (l) h += bandeauLait(l) + autresLaits(l);

    var src = S.sourcePosition;
    var ou = src && src.type === "manuel" ? "autour de " + ech(src.libelle) : "autour de vous";
    var n = S.resultats.length;

    if (!n) {
      return h + '<div class="question-bloc"><div class="vide-rond">·</div>' +
        "<h2>Aucun point de vente trouvé</h2>" +
        '<p class="chapo">Même à ' + RAYON_MAX + "&nbsp;km " + ou + ", BIBE ne connaît aucun point de vente.</p></div>" +
        '<button class="cta-2" data-va="localisation">Chercher ailleurs</button>';
    }

    // La liste s'arrete aux 60 plus proches : en ville il y en a bien plus
    // dans le rayon, et le compte affiche ne doit pas laisser croire le contraire.
    h += '<p class="compte-res"><b>' + (S.total > n ? "Les " + n + " plus proches" :

      ", à moins de " + S.rayonEffectif + "&nbsp;km.</p>";

    if (S.rayonEffectif > S.rayon) {

    h += '<div class="rayons" role="group" aria-label="Rayon de recherche">';
    RAYONS.forEach(function (r) {

    });

    if (l) {
      h += '<div class="alerte">BIBE ne sait pas encore quels points de vente proposent ce lait. ' +

    }

    S.resultats.forEach(function (r, i) {
      var p = r.p, ret = l ? S.retours[idPdv(p) + "|" + cleLait(l)] : null;

        '<span class="pdv-nom">' + ech(p[0]) + '</span><br><span class="pdv-adr">' +

        formaterDist(r.d) + '</span></span><span class="etiquettes">';
      if (ret && ret.v === "oui") h += '<span class="etiquette trouve">Trouvé ici le ' + ech(ret.date) + "</span>";
      else if (ret && ret.v === "non") h += '<span class="etiquette absent">Absent le ' + ech(ret.date) + "</span>";
      else if (l) h += '<span class="etiquette inconnu">Référencement non déclaré</span>';
      // Ouvert ou ferme : c'est ce qu'un parent presse regarde en premier,
      // avant meme la distance.
      var e = etatHoraire(p[8]);
      if (e) h += '<span class="etiquette ' + (e.ouvert ? "ouvert" : "ferme") + '">' +
        (e.ouvert ? "Ouvert" : "Fermé") + (e.message ? " · " + ech(e.message.replace(/^Ouvre?[rt]? /, "")) : "") + "</span>";
      if (p[7] === 1) h += '<span class="etiquette para">Parapharmacie</span>';
      if (!p[4]) h += '<span class="etiquette para">Pas de numéro connu</span>';
      h += "</span></button>";
    });

    if (l) h += '<button class="cta-2" data-va="equivalents">Voir les équivalents de ce lait</button>';
    return h;
  };

  V.fiche = function () {
    var r = S.resultats[S.pdv];
    if (!r) return V.resultats();
    var p = r.p, et = etatHoraire(p[8]);
    var h = haut("Résultats", "resultats") + "<h1>" + ech(p[0]) + "</h1>" +
      '<p class="chapo">' + ech([p[1], [p[2], p[3]].filter(Boolean).join(" ")].filter(Boolean).join(", ")) + "</p>";
    h += '<div class="fiche-actions">' +
      (p[4] ? '<a class="act-1" id="appeler" href="' + telLien(p[4]) + '" style="text-align:center;text-decoration:none">Appeler</a>'
            : '<button class="act-1" disabled>Pas de numéro</button>') +
      '<button class="act-2" data-va="navigation">Y aller</button></div>';
    h += '<div class="infos"><div class="info"><span class="k">Distance</span><span>' + formaterDist(r.d) + "</span></div>" +
      '<div class="info"><span class="k">Téléphone</span><span>' +
      (p[4] ? '<a href="' + telLien(p[4]) + '">' + ech(p[4]) + "</a>" : "Non renseigné") + "</span></div>" +
      (et ? '<div class="info"><span class="k">Aujourd\'hui</span><span>' + ligneAujourdhui(et) + "</span></div>" +
        '<div class="info"><span class="k">Horaires</span><span>' + horairesSemaine(p[8]) + "</span></div>" : "") +
      '<div class="info"><span class="k">Type</span><span>' + (p[7] === 1 ? "Parapharmacie" : "Pharmacie") + "</span></div></div>";
    if (S.lait) {
      h += '<button class="cta-2" data-va="retour">Dire si j\'ai trouvé mon lait ici</button>';

    // Pas de source nommee ici : elle varie selon le point de vente (FINESS
    // pour les pharmacies, OpenStreetMap ou SIRENE pour les parapharmacies,

    h += '<div class="aide">Ces informations viennent de sources publiques et peuvent avoir changé' +

    return h;
  };

  V.navigation = function () {
    var r = S.resultats[S.pdv];
    if (!r) return V.resultats();
    var p = r.p, dest = p[5] + "," + p[6];
    var q = encodeURIComponent([p[0], p[1], p[2], p[3]].filter(Boolean).join(", "));
    return haut("Fiche", "fiche") + "<h1>Y aller</h1>" +
      '<p class="chapo">' + ech(p[0]) + " · " + formaterDist(r.d) + "</p>" +
      '<a class="ligne" href="https://maps.apple.com/?daddr=' + dest + "&q=" + q + '" target="_blank" rel="noopener"><span class="nom">Plans</span></a>' +
      '<a class="ligne" href="https://www.google.com/maps/dir/?api=1&destination=' + dest + '" target="_blank" rel="noopener"><span class="nom">Google Maps</span></a>' +
      '<a class="ligne" href="https://waze.com/ul?ll=' + dest + '&navigate=yes" target="_blank" rel="noopener"><span class="nom">Waze</span></a>' +
      // La question viendra d'elle-meme si le parent l'accepte ; sinon il
      // reste ce bouton, pour ceux qui refusent les notifications.
      (S.lait && pushProposable()
        ? '<div class="aide">BIBE peut vous demander dans quelques heures si vous avez trouvé ' +

        : '<div class="aide">L\'application choisie s\'ouvre avec l\'itinéraire.</div>') +

  };

  V.retour = function () {
    var r = S.resultats[S.pdv];
    if (!r || !S.lait) return V.resultats();
    return haut("Fiche", "fiche") + '<div class="question-bloc"><h1>Ils l\'avaient&nbsp;?</h1>' +
      '<p class="chapo">' + ech(r.p[0]) + "<br>" + ech(S.lait.marque) + " " + ech(S.lait.produit) + "</p>" +
      '<div class="reponses"><button class="rep" data-rep="oui">Oui</button>' +
      '<button class="rep" data-rep="non">Non</button></div></div>' +
      '<div class="aide">Votre réponse reste sur votre téléphone. Elle s\'affichera sur ' + ceLieu(r.p) +
      " la prochaine fois que vous chercherez ce lait.</div>";
  };

  V.merci = function () {
    var r = S.resultats[S.pdv];
    return haut("Résultats", "resultats") + '<div class="question-bloc"><div class="vide-rond ok">✓</div>' +
      "<h1>C'est noté</h1><p class=\"chapo\">Vous le retrouverez sur " + (r ? ceLieu(r.p) : "ce point de vente") +
      " la prochaine fois que vous chercherez ce lait.</p></div>" +
      '<button class="cta vert" data-va="resultats">Revenir aux résultats</button>';
  };

  /* Un lait qui manque au catalogue.

     Le meme ecran sert des deux cotes, parce que c'est le meme manque :
     le parent ne trouve pas sa boite, le point de vente ne trouve pas une
     reference qu'il vend. Rien n'entre au catalogue directement : le
     signalement part vers BIBE, il est verifie, puis la reference arrive
     dans une prochaine version. Sans cette verification, une faute de
     frappe ou un doublon s'afficherait chez tous les parents. */
  function blocIntrouvable(q, pro) {
    var h = '<div class="aide"><b>BIBE n\'a pas ce lait.</b> ' +
      (pro ? "Rien de ce que vous vendez ne doit rester invisible."
           : "Le catalogue couvre les marques vendues en pharmacie en France, il n'est pas complet.") +
      "</div>";

      h += '<button class="cta-2" data-va="signalLait">Signaler un lait qui manque</button>';
    }
    return h;
  }

  V.signalLait = function () {
    var pro = S.role === "pro";
    var deja = S.signalEnvoyes.indexOf(aplatir(S.signalNom)) >= 0;
    var pret = S.signalNom.trim().length >= 3 && !deja;
    return haut("Retour", "marques") + "<h1>Quel lait manque&nbsp;?</h1>" +
      '<p class="chapo">' +
      (pro ? "Écrivez la référence telle qu'elle est sur la boîte. Elle est vérifiée, puis ajoutée au catalogue."
           : "Écrivez le nom tel qu'il est sur la boîte. BIBE le vérifie et l'ajoute au catalogue.") +
      "</p>" +
      '<input class="champ" id="signal-nom" type="text" autocomplete="off" enterkeyhint="send" ' +
      'placeholder="Marque et nom, par exemple Guigoz Evolia 2" value="' + ech(S.signalNom) + '">' +
      (deja ? '<div class="aide">Vous avez déjà signalé ce lait. Merci.</div>' : "") +
      (S.signalEtat === "erreur" ? '<div class="aide alerte">L\'envoi n\'a pas abouti. Réessayez plus tard.</div>' : "") +
      '<button class="cta vert" id="signal-envoi"' + (pret ? "" : " disabled") + ">" +
      (S.signalEtat === "envoi" ? "Envoi…" : "Envoyer") + "</button>" +
      '<div class="aide">BIBE ne reçoit que ce nom. Ni votre adresse, ni votre position.</div>';
  };

  V.signalMerci = function () {

  V.proInscription = function () {

  /* ================================================================== */
  /* Navigation                                                           */
  /* ================================================================== */

  var ONGLETS_PARENT = [["accueil", "Chercher"], ["mesLaits", "Mes laits"], ["reglages", "Réglages"]];
  var ONGLETS_PRO = [["proAccueil", "Mon espace"], ["marques", "Références"], ["reglages", "Réglages"]];

  function rendreBas() {
    var ong = S.role === "pro" ? ONGLETS_PRO : ONGLETS_PARENT;
    var principal = ong.some(function (o) { return o[0] === S.vue; });
    var visible = !!S.role && principal;
    $b.style.display = visible ? "flex" : "none";
    $e.classList.toggle("avec-bas", visible);
    $b.innerHTML = ong.map(function (o) {

    }).join("");

  function rendre() {
    // L'ambiance suit le profil : vert d'officine pour un point de vente,
    // bleu-violet plus doux pour un parent. Tant qu'il n'a pas choisi,
    // c'est le vert, qui est la couleur de BIBE.
    document.documentElement.dataset.profil = S.role === "parent" ? "parent" : "pro";
    var fn = V[S.vue] || V.accueil;
    $e.innerHTML = fn();
    $e.scrollTop = 0;
    rendreBas();
    brancher();

  /* Histoire de la navigation, pour le balayage : la droite ramene a
     l'ecran precedent, la gauche revient sur ses pas. Les boutons de retour
     existants passent aussi par aller(), donc tout reste coherent. */
  function aller(v) {
    if (v !== S.vue) {
      S.pile.push(S.vue);
      if (S.pile.length > 40) S.pile.shift();
      S.pileAvant = [];
    }
    S.vue = v;
    rendre();
  }

  function revenir() {
    if (!S.pile.length) return false;
    S.pileAvant.push(S.vue);
    S.vue = S.pile.pop();
    rendre();
    return true;
  }

  function avancer() {
    if (!S.pileAvant.length) return false;
    S.pile.push(S.vue);
    S.vue = S.pileAvant.pop();
    rendre();
    return true;
  }

  /* Un balayage franc et horizontal, pas un defilement de travers : au
     moins 60 px, deux fois plus horizontal que vertical, et en moins d'une
     seconde. Sans ces trois conditions, l'app changerait d'ecran pendant
     qu'un parent fait defiler sa liste. */
  /* Un balayage peut etre pris par une carte d'enfant, qui decouvre son
     bouton Supprimer. Dans ce cas il ne doit pas AUSSI faire changer
     d'ecran : sans ce drapeau, glisser une carte vers la gauche
     supprimait et avancait d'un ecran du meme geste. */
  var gesteAbsorbe = false;

  /* ================================================================== */
  /* La question posee quelques heures apres un itineraire              */
  /* ================================================================== */

  /* Personne ne rouvre une application pour dire qu'il a trouve son lait.
     La question vient donc a lui, une fois, quelques heures apres qu'il a
     demande l'itineraire, dans une notification a deux boutons.

        aller("accueil");
      });
    });

    // Passer a un autre lait du meme enfant, depuis les resultats.
    $e.querySelectorAll("[data-autre-lait]").forEach(function (b) {
      b.addEventListener("click", function () {
        var e = enfantDuLait(S.lait);
        var l = e && e.laits[+b.dataset.autreLait];
        if (!l || (l.marque === S.lait.marque && l.produit === S.lait.produit)) return;
        var p = PRODUITS[l.marque + "|" + l.produit];
        S.marqueOuverte = l.marque;
        S.lait = { marque: l.marque, produit: l.produit, spec: p ? p[2] : "" };
        // La liste des points de vente ne depend que de la position, pas
        // du lait : inutile de la refaire. Ce qui change, ce sont les
        // etiquettes de referencement, recalculees a l'affichage. On
        // oublie en revanche la fiche ouverte, qui parlait de l'autre lait.
        S.pdv = null;
        rendre();
      });
    });

    var vr = $("veut-rappel");
    if (vr) vr.addEventListener("click", function () {
      var r = S.resultats[S.pdv];
      if (!r || !S.lait) return;
      vr.disabled = true;
      vr.textContent = "…";
      demanderNotifications({
        pdv: idPdv(r.p), cle: cleLait(S.lait),
        lait: S.lait.marque + " " + S.lait.produit, lieu: r.p[0],
      }).then(function (ok) {
        // On ne redemande pas : un refus est un refus.
        toast(ok ? "BIBE vous posera la question plus tard"
                 : "Sans notification, le bouton ci-dessous reste là");
        rendre();
      });
    });

    var sn = $("signal-nom");
    if (sn) sn.addEventListener("input", function () {
      S.signalNom = sn.value;
      S.signalEtat = null;
      var pos = sn.selectionStart;
      rendre();
      var ns = $("signal-nom");
      if (ns) { ns.focus(); try { ns.setSelectionRange(pos, pos); } catch (e) {} }
    });

    var se = $("signal-envoi");
    if (se) se.addEventListener("click", function () {
      var nom = S.signalNom.trim();
      if (nom.length < 3 || S.signalEtat === "envoi") return;
      S.signalEtat = "envoi";
      rendre();
      appelServeur("/lait-manquant", { nom: nom, role: S.role === "pro" ? "pro" : "parent" }).then(function () {
        // Retenu pour ne pas redemander la meme chose : le nom seul, pas
        // la date ni la position, c'est tout ce que BIBE envoie.
        S.signalEnvoyes = S.signalEnvoyes.concat([aplatir(nom)]).slice(-30);
        ecrire("signales", S.signalEnvoyes);
        S.signalNom = "";
        S.signalEtat = null;
        aller("signalMerci");
      }, function () {
        S.signalEtat = "erreur";
        rendre();
      });
    });
  }

  function copierSecours(txt) {
    try {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  /* ================================================================== */
  /* Demarrage                                                            */
  /* ================================================================== */

  S.vue = S.role ? (S.role === "pro" ? "proAccueil" : "accueil") : "role";

  var splash = $("splash");
  function fermerSplash() { if (splash) { splash.style.display = "none"; splash = null; } }
  splash.addEventListener("click", fermerSplash);
  setTimeout(fermerSplash, 1400);

  // Le fichier des pharmacies se telecharge en arriere-plan des l'ouverture,
  // pour etre pret quand le parent lance sa premiere recherche.
  chargerPdv().catch(function () { /* on reessaiera a la recherche */ });

  window.BIBE_TEST = {
    etat: S,
    familles: FAMILLES,
    equiv: EQUIV,
    chercherAutour: function (a, b, c) { return chercherAutour(a, b, c); },
    localiserTexte: function (t) { return localiserTexte(t); },
    candidatsDuLieu: function (t) { return candidatsDuLieu(t); },
    cheminAutorisation: cheminAutorisation,
    ligneAujourdhui: ligneAujourdhui,
    villes: function () { return PDV.map(function (p) { return p[3]; }); },
    anciensNoms: ANCIENS_NOMS,
    // Le banc joue le serveur : il l'annonce ici, puis intercepte les appels.
    // La version deposee, elle, part avec SERVEUR vide tant qu'il n'existe
    // pas, ce que verifie la serie des textes.
    brancherServeur: function (url) { SERVEUR = url || ""; },
    serveurPret: serveurPret,
    etatHoraire: etatHoraire,
    horairesSemaine: horairesSemaine,
    revenir: revenir,
    avancer: avancer,
    chargerPdv: chargerPdv,
    distanceKm: distanceKm,
    formaterDist: formaterDist,
    telLien: telLien,
    // Rejoue un premier lancement : sans cela, le cache du navigateur sert
    // les donnees et le chemin d'echec n'est jamais parcouru par les tests.
    oublierDonnees: function () { PDV = null; chargementPdv = null; INDEX_LIEUX = null; },
    pushProposable: pushProposable,
    idPdv: idPdv,
    enfantsLus: enfantsLus,
    // Le banc pose la cle comme il pose l'adresse du serveur : sans
    // elle, l'abonnement s'arrete avant de partir, et c'est voulu.
    brancherPush: function (c) { CLE_PUSH = c; },
    reprendreReponses: reprendreReponses
  };

  rendre();

  /* Une reponse donnee depuis une notification, application fermee, doit
     apparaitre a la reouverture : elle a ete deposee par le service
     worker et personne ne l'a encore relue. */
  reprendreReponses().then(function (n) { if (n) rendre(); });

  // Meme chose quand l'application est deja ouverte : le service worker
  // previent plutot que d'attendre le prochain lancement.
  if ("serviceWorker" in navigator && navigator.serviceWorker.addEventListener) {
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (e.data && e.data.bibe === "retour") {
        var d = e.data.d || {};
        if (d.pdv && d.cle) { S.pdvAttendu = d; aller("retour"); }
      }
    });
  }
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
